const UG_BASE = "https://tabs.ultimate-guitar.com/tab/";
function ugVersions(songId, kind){
  const d=(S.ugv||{})[songId]; if(!d) return [];
  return (kind==="tab"?d.t:d.c||[]).map(x=>{ const [path,rating,votes,version,name]=String(x).split("~"); return {url:UG_BASE+path, rating:+rating, votes:+votes, version:+version, name}; });
}
function ugSearch(song, kind){ return `https://www.ultimate-guitar.com/search.php?search_type=title&value=${encodeURIComponent(song.title+" "+(song.artist||""))}`; }
function fillQueue(){
  const songs=[...S.songs.values()].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  const q=[];
  for(const s of songs){ const sh=getSheets(s).filter(x=>(x.text||"").trim()), sk=s.skipFill||{};
    if(!sh.some(x=>x.kind!=="tab") && !sk.chords) q.push({song:s, kind:"chords"});
    if(!sh.some(x=>x.kind==="tab") && !sk.tab) q.push({song:s, kind:"tab"}); }
  return q;
}
S.fillVer = {};
function stepUrl(step){ if(!step) return null; const vs=ugVersions(step.song.id, step.kind); const i=S.fillVer[step.song.id+step.kind]||0; return vs[i] ? vs[i].url : ugSearch(step.song, step.kind); }

    song.sheets=song.sheets.concat([sh]);

        <div class="muted" style="font-size:13px">${[c.rating?("★ "+c.rating+(c.votes?" ("+c.votes+" votes)":"")):"", c.key?("key "+c.key):"", c.capo?("capo "+c.capo):"", c.difficulty||""].filter(Boolean).map(esc).join(" · ")}</div>
        ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" style="font-size:13px">Open original</a>`:""}

async function approve(pid, idx){
  const p = S.pending.find(x=>x.id===pid); if(!p) return;
  const c = (p.candidates||[])[idx]; if(!c) return;
  let song = p.songId ? S.songs.get(p.songId) : null;
  if(!song){
    song = {id:p.songId||uid(), title:p.songTitle||c.label||"Untitled", artist:p.artist||"", sheets:[], sources:[], shots:[], notes:"", createdAt:new Date().toISOString()};
    song.lang = hasHeb(song.title)?"he":"en";
  }
  migrate(song);
  const txt = c.text || (c.sections ? serializeSheet({sections:c.sections}) : "");
  if(txt){ const first = !song.sheets.length; song.sheets = song.sheets.concat([{id:uid(), kind:c.sheetKind||"chords", label:c.label||"", text:txt, capo:+c.capo||0, source:KINDS[c.kind]||c.source||"", url:c.url||""}]);
    if(first){ song.capo=+c.capo||0; if(c.key && !song.key) song.key=c.key; } }
  if(c.url && !(song.sources||[]).some(s=>s.url===c.url)) song.sources=(song.sources||[]).concat([{id:uid(), url:c.url, kind:srcKind(c.url), title:c.label||"", note:[c.rating?"★ "+c.rating:"", c.capo?"capo "+c.capo:""].filter(Boolean).join(" · "), marks:c.marks||[]}]);
  if(p.sourceUrl && !(song.sources||[]).some(s=>s.url===p.sourceUrl)) song.sources=(song.sources||[]).concat([{id:uid(), url:p.sourceUrl, kind:srcKind(p.sourceUrl), title:p.sourceTitle||"", marks:p.sourceMarks||[]}]);
  await saveSong(song); await deletePending(pid);
  toast("Saved to "+song.title); location.hash="song-"+song.id;
}

// ================= practice player: one tempo drives click + scroll =================
const P = {on:false, click:true, scroll:true, tempo:null, feel:1, raf:0, last:0, acc:0, timer:null, next:0, beat:0, song:null};
const PX_PER_BAR = 25; // ≈ one chord+lyric line pair per two bars
function bpmOf(song){ return P.tempo!==null ? P.tempo : (+song.bpm||80); }
function quarterBeats(song){ const t=song.timeSig||"4/4"; return t==="3/4"?3:t==="2/4"?2:t==="6/8"?3:t==="12/8"?6:4; }
function playerUI(){
  const b=$("#playBtn"); if(b){ b.textContent=P.on?"Stop":"Play"; b.setAttribute("aria-pressed", String(P.on)); }
}
function startPlayer(song){
  P.on=true; P.song=song; playerUI();
  // scroll
  P.last=performance.now(); P.acc=0;
  const step=now=>{ if(!P.on) return; const dt=(now-P.last)/1000; P.last=now;
    if(P.scroll){ const pxs = bpmOf(song)/60/quarterBeats(song)*PX_PER_BAR*P.feel; P.acc+=dt*pxs; const px=Math.floor(P.acc); if(px){ P.acc-=px; window.scrollBy(0,px); }
      if(window.innerHeight+window.scrollY >= document.body.scrollHeight-2){ stopPlayer(); return; } }
    P.raf=requestAnimationFrame(step); };
  P.raf=requestAnimationFrame(step);
  // click
  let ac=null; try{ ac=ctx(); }catch(e){ ac=null; }
  if(!ac) return;
  const eighths = song.timeSig==="6/8"||song.timeSig==="12/8";
  const beats = beatsOf(song);
  P.beat=0; P.next=ac.currentTime+0.06;
  P.timer=setInterval(()=>{
    const per = eighths ? 60/bpmOf(song)/2 : 60/bpmOf(song);
    while(P.next < ac.currentTime+0.12){
      const bi=P.beat%beats;
      if(P.click){ const o=ac.createOscillator(), g=ac.createGain(); const acc=bi===0;
        o.frequency.value = acc?1600:1000; g.gain.setValueAtTime(0.0001,P.next); g.gain.exponentialRampToValueAtTime(acc?0.5:0.3, P.next+0.002); g.gain.exponentialRampToValueAtTime(0.0001, P.next+0.05);
        o.connect(g).connect(ac.destination); o.start(P.next); o.stop(P.next+0.06); }
      const when=(P.next-ac.currentTime)*1000;
      setTimeout(()=>{ if(P.on) document.querySelectorAll(".beat").forEach(el=>el.classList.toggle("on", +el.dataset.b===bi)); }, Math.max(0,when));
      P.beat++; P.next+=per;
    }
  }, 25);
}

// ================= tuner (microphone, local pitch detection; nothing is recorded) =================
const TN_NOTE = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const TN_STD = [40,45,50,55,59,64];
const TN_PRESETS = [
  ["Standard", [40,45,50,55,59,64]], ["Drop D", [38,45,50,55,59,64]],
  ["Half step down", [39,44,49,54,58,63]], ["Full step down", [38,43,48,53,57,62]],
  ["Drop C", [36,43,48,53,57,62]], ["DADGAD", [38,45,50,55,57,62]],
  ["Open G", [38,43,50,55,59,62]], ["Open D", [38,45,50,54,57,62]], ["Open E", [40,47,52,56,59,64]],
];
const tnName = m => TN_NOTE[((m%12)+12)%12] + (Math.floor(m/12)-1);
const tnHz = m => 440*Math.pow(2,(m-69)/12);
let TN = null;   // {stream, ac, an, buf, timer, tune[6], lock, hist[], okRun, ok[6]}

function tnLoad(){
  try{ const t=JSON.parse(localStorage.getItem("songbook-tuner")||"null"); if(Array.isArray(t)&&t.length===6&&t.every(x=>Number.isInteger(x)&&x>=24&&x<=80)) return t; }catch(_){}
  return TN_STD.slice();
}
function tnSave(t){ try{ localStorage.setItem("songbook-tuner", JSON.stringify(t)); }catch(_){} }

// a song's "Tuning" text -> six MIDI notes (low to high), or null when it can't be read
function tnParse(s){
  s=String(s||"").trim(); if(!s) return null;
  const low=s.toLowerCase().replace(/\s+/g," ");
  for(const [n,t] of TN_PRESETS) if(low===n.toLowerCase()) return t.slice();
  if(/^(e )?standard( tuning)?$/.test(low)) return TN_STD.slice();
  if(/half[ -]?step down|^e[b♭] standard|^d# standard/.test(low)) return TN_STD.map(m=>m-1);
  if(/(full|whole)[ -]?step down|^d standard/.test(low)) return TN_STD.map(m=>m-2);
  const toks=[...s.matchAll(/([A-G]|e)(#|♯|b|♭)?/g)];
  if(toks.length!==6) return null;
  return toks.map((k,i)=>{
    const pc=(NOTE_PC[k[1].toUpperCase()]+(k[2]==="#"||k[2]==="♯"?1:k[2]?-1:0)+12)%12;
    let best=null; for(let m=TN_STD[i]-7;m<=TN_STD[i]+4;m++) if(((m%12)+12)%12===pc && (best===null||Math.abs(m-TN_STD[i])<Math.abs(best-TN_STD[i]))) best=m;
    return best;
  });
}

// YIN pitch estimate on a time-domain frame; returns Hz or 0
function tnPitch(buf, sr){
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/buf.length) < 0.006) return 0;
  const W=Math.floor(buf.length/2), tmin=Math.floor(sr/1000), tmax=Math.min(W-2, Math.ceil(sr/55));
  const d=new Float32Array(tmax+2);
  for(let tau=1;tau<=tmax+1;tau++){ let s=0; for(let i=0;i<W;i++){ const x=buf[i]-buf[i+tau]; s+=x*x; } d[tau]=s; }
  let run=0; d[0]=1; for(let tau=1;tau<=tmax+1;tau++){ run+=d[tau]; d[tau]=run? d[tau]*tau/run : 1; }
  let tau=-1;
  for(let t=tmin;t<=tmax;t++){ if(d[t]<0.15){ while(t+1<=tmax && d[t+1]<d[t]) t++; tau=t; break; } }
  if(tau<0) return 0;
  const a=d[tau-1], b=d[tau], c=d[tau+1], den=a-2*b+c;
  const shift = den ? 0.5*(a-c)/den : 0;
  return sr/(tau+Math.max(-1,Math.min(1,shift)));
}

const tnPc = m => TN_NOTE[((m%12)+12)%12];
const tnOrd = i => (6-i)+["st","nd","rd","th","th","th"][5-i];
function tnSel(){ return TN.lock>=0 ? TN.lock : (TN.si==null?-1:TN.si); }
function tunerPresetVal(){ const p=TN_PRESETS.find(([,t])=>t.every((m,i)=>m===TN.tune[i])); return p?p[0]:""; }

    <button type="button" class="btn small ghost" id="tnEditBtn" title="Set your own notes" aria-label="Custom notes" aria-expanded="${TN.edit?"true":"false"}">✏️</button>
    <label class="tn-auto" title="Auto: the tuner finds the string by itself"><input type="checkbox" id="tnAuto"${TN.lock<0?" checked":""}><i></i>Auto</label>`;
}
function tunerHeadHTML(){

  const peg=i=>`<div class="tn-pw"><button type="button" class="tn-peg${sel===i?" on":""}${TN.ok[i]?" ok":""}" data-tnpeg="${i}" aria-label="${tnOrd(i)} string ${tnName(TN.tune[i])}" title="${tnOrd(i)} string (${tnName(TN.tune[i])}). Tap to tune only this string" aria-pressed="${TN.lock===i}">${tnPc(TN.tune[i])}</button><button type="button" class="pl" data-tnplay="${i}" aria-label="Play ${tnName(TN.tune[i])}" title="Play this note">♪</button></div>`;
  const lines=TN.tune.map((m,i)=>{ const x=34+i*10.4; return `<line class="st${sel===i?" on":""}" data-tnst="${i}" x1="${x}" y1="14" x2="${x}" y2="196"/>`; }).join("");
  return `<div class="tn-col">${[2,1,0].map(peg).join("")}</div>
    <svg class="tn-headsvg" viewBox="0 0 120 200" aria-hidden="true"><path class="hs" d="M26 20 Q60 2 94 20 L100 118 L88 200 L32 200 L20 118 Z"/>${lines}</svg>
    <div class="tn-col">${[3,4,5].map(peg).join("")}</div>`;
}
function tunerEditHTML(){
  if(!TN.edit) return "";
  const opts = sel => { let h=""; for(let m=28;m<=76;m++) h+=`<option value="${m}"${m===sel?" selected":""}>${tnName(m)}</option>`; return h; };
  return `<div class="tn-edit">${[0,1,2,3,4,5].map(i=>`<label>${tnOrd(i)} string<select data-tnsel="${i}">${opts(TN.tune[i])}</select></label>`).join("")}</div>`;
}
function tunerTools(){

}
function tnResetRead(){
  const n=$("#tnNote"), d=$("#tnNeedle"), u=$("#tnSub");

function tunerRedraw(){
  const ae=document.activeElement, sel=ae&&ae.closest&&ae.closest("#dlgBody")?(ae.id?"#"+ae.id:ae.dataset.tnpeg!=null?'[data-tnpeg="'+ae.dataset.tnpeg+'"]':ae.dataset.tnplay!=null?'[data-tnplay="'+ae.dataset.tnplay+'"]':ae.dataset.tnsel!=null?'[data-tnsel="'+ae.dataset.tnsel+'"]':""):"";
  const m={tnTop:tunerTopHTML, tnHead:tunerHeadHTML, tnEdit:tunerEditHTML, tnTools:tunerTools};

}
function tunerSet(t){ TN.tune=t.slice(); TN.ok=[0,0,0,0,0,0]; TN.hist=[]; tnSave(TN.tune); tnResetRead(); tunerRedraw(); }
function tunerGaugeHTML(){
  const P=(a,r)=>{ const q=a*Math.PI/180; return [(120+r*Math.sin(q)).toFixed(2),(125-r*Math.cos(q)).toFixed(2)]; };
  const arc=(a0,a1)=>{ const [x0,y0]=P(a0,100), [x1,y1]=P(a1,100); return `M${x0} ${y0} A100 100 0 0 1 ${x1} ${y1}`; };
  let ticks=""; for(const c of [-50,-25,0,25,50]){ const a=c/50*70, [x0,y0]=P(a,86), [x1,y1]=P(a,76); ticks+=`<line class="tn-tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; }
  return `<svg viewBox="0 0 240 134" aria-hidden="true"><path class="tn-arc" d="${arc(-70,70)}"/><path class="tn-zone" d="${arc(-7,7)}"/>${ticks}<line class="tn-needle" id="tnNeedle" x1="120" y1="63" x2="120" y2="27"/></svg>
    <div class="tn-read"><div class="tn-note" id="tnNote">–</div></div>`;
}

async function openTuner(){
  tunerStop();
  TN = { tune: tnLoad(), lock:-1, hist:[], okRun:0, ok:[0,0,0,0,0,0], edit:false };
  openDlg("Tuner", `<div class="tn-top" id="tnTop">${tunerTopHTML()}</div>
    <div id="tnEdit">${tunerEditHTML()}</div>
    <div class="tn-gauge">${tunerGaugeHTML()}</div>
    <div class="tn-sub" id="tnSub">Starting the microphone…</div>
    <div class="tn-head" id="tnHead">${tunerHeadHTML()}</div>
    <div class="tn-tools" id="tnTools">${tunerTools()}</div>
    <p class="help">The sound is analysed on this computer and never saved. Your tuning is remembered in this browser.</p>`);
  const body=$("#dlgBody");
  body.onchange = e => {
    const s=e.target.closest("[data-tnsel]");
    if(s){ const t=TN.tune.slice(); t[+s.dataset.tnsel]=+s.value; tunerSet(t); return; }
    if(e.target.id==="tnPreset" && e.target.value){ const p=TN_PRESETS.find(([n])=>n===e.target.value); if(p) tunerSet(p[1]); }
    if(e.target.id==="tnAuto"){ TN.lock = e.target.checked ? -1 : (TN.si>=0 ? TN.si : 0); TN.hist=[]; tnResetRead(); tunerRedraw(); }
  };
  body.onclick = e => {
    const p=e.target.closest("[data-tnplay]");
    if(p){ tnTone(TN.tune[+p.dataset.tnplay]); return; }
    if(e.target.id==="tnSong"){ const t=tnParse((curSong()||{}).tuning); if(t) tunerSet(t); return; }
    if(e.target.closest("#tnEditBtn")){ TN.edit=!TN.edit; tunerRedraw(); return; }
    const b=e.target.closest("[data-tnpeg]");
    if(b){ const i=+b.dataset.tnpeg; TN.lock = TN.lock===i ? -1 : i; TN.hist=[]; tnResetRead(); tunerRedraw(); }
  };
  $("#dlg").addEventListener("close", tunerStop, {once:true});
  const me=TN;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    if(TN!==me){ stream.getTracks().forEach(t=>t.stop()); return; }
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") await ac.resume().catch(()=>{});
    const an=ac.createAnalyser(); an.fftSize=4096;
    ac.createMediaStreamSource(stream).connect(an);
    Object.assign(TN, {stream, ac, an, buf:new Float32Array(an.fftSize)});
    $("#tnSub").textContent="Play one string";
    TN.timer=setInterval(tunerTick, 60);
  }catch(err){
    const s=$("#tnSub"); if(s) s.textContent = err && err.name==="NotAllowedError" ? "Microphone blocked. Allow it from the 🔒 icon in the address bar and open the tuner again." : "No microphone found ("+(err&&err.message||err)+")";
  }
}

function tnMarkSel(si){
  document.querySelectorAll("[data-tnpeg]").forEach(b=>b.classList.toggle("on", +b.dataset.tnpeg===si));
  document.querySelectorAll("[data-tnst]").forEach(l=>l.classList.toggle("on", +l.dataset.tnst===si));
}

function tunerStop(){
  if(!TN) return;
  clearInterval(TN.timer);
  if(TN.stream) TN.stream.getTracks().forEach(t=>t.stop());
  if(TN.ac) TN.ac.close().catch(()=>{});
  TN=null;
}

function tnTone(m){
  try{ const ac=ctx(), t=ac.currentTime+0.02, o=ac.createOscillator(), g=ac.createGain();
    o.type="triangle"; o.frequency.value=tnHz(m);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+2);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+2.05); }catch(_){}
}

function tunerTick(){
  const note=$("#tnNote");
  if(!TN || !note){ tunerStop(); return; }
  TN.an.getFloatTimeDomainData(TN.buf);
  const f=tnPitch(TN.buf, TN.ac.sampleRate);
  const sub=$("#tnSub"), nd=$("#tnNeedle");
  if(!f){ if(TN.hist.length && ++TN.quiet>6){ TN.hist=[]; } if(!TN.hist.length){ sub.textContent="Play one string"; nd.classList.remove("ok"); note.classList.remove("ok"); } return; }
  TN.quiet=0;
  const midiF=69+12*Math.log2(f/440);
  // which string: the locked one, or the one whose target is nearest
  let si=TN.lock;
  if(si<0){ let bd=1e9; TN.tune.forEach((m,i)=>{ const dd=Math.abs(midiF-m); if(dd<bd){ bd=dd; si=i; } }); }
  if(TN.si!==si){ TN.si=si; TN.hist=[]; tnMarkSel(si); }
  TN.hist.push(midiF); if(TN.hist.length>5) TN.hist.shift();
  const sm=TN.hist.slice().sort((a,b)=>a-b)[TN.hist.length>>1];
  const target=TN.tune[si], cents=(sm-target)*100, ok=Math.abs(cents)<=5;
  note.innerHTML=tnPc(target)+"<small>"+(Math.floor(target/12)-1)+"</small>"; note.classList.toggle("ok", ok);
  nd.style.transform="rotate("+(Math.max(-50,Math.min(50,cents))/50*70)+"deg)"; nd.classList.toggle("ok", ok);
  const heard=tnName(Math.round(sm));
  sub.textContent = `${tnOrd(si)} string · hearing ${heard} (${(440*Math.pow(2,(sm-69)/12)).toFixed(1)} Hz) · ` +
    (ok ? "in tune ✓" : (cents<0 ? "too low, tighten" : "too high, loosen") + ` (${cents>0?"+":""}${Math.round(cents)} cents)`);
  TN.okRun = ok ? TN.okRun+1 : 0;
  if(TN.okRun>=6 && !TN.ok[si]){ TN.ok[si]=1; const e=document.querySelector('[data-tnpeg="'+si+'"]'); if(e) e.classList.add("ok"); }
}

  document.getElementById("dkMin").onclick=()=>{ DK.min=!DK.min; d.classList.toggle("min",DK.min); document.body.classList.toggle("dock-min", DK.min); document.getElementById("dkMin").textContent=DK.min?"▢":"–"; };
  document.getElementById("dkX").onclick=()=>{ const sid=DK.songId; dockTeardown(); DK.closed[sid]=true; };
  d.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>dockRate(+b.dataset.rate));
  document.getElementById("dkPlay").onclick=dockToggle;
  if(ig){
    document.getElementById("dkCap").onclick=()=>dockSend({type:"songbook-capture"});
    DK.pingT=setInterval(()=>dockSend({type:"songbook-ping"}),1200);
    DK.warnT=setTimeout(()=>{ if(!DK.ready){ const st=document.getElementById("dkSt"); if(st) st.textContent="The extension wasn't detected here. Moment buttons will open Instagram instead."; } },7000);
  } else {
    document.getElementById("dkA").onclick=()=>{ if(!DK.ytReady) return; DK.a=DK.yt.getCurrentTime(); if(DK.b!==null&&DK.b<=DK.a) DK.b=null; ytLoopLabel(); };
    document.getElementById("dkB").onclick=()=>{ if(!DK.ytReady) return; DK.b=DK.yt.getCurrentTime(); if(DK.a===null||DK.a>=DK.b) DK.a=Math.max(0,DK.b-5); ytLoopLabel(); };
    document.getElementById("dkAB").onclick=()=>{ DK.a=DK.b=null; ytLoopLabel(); };
    const vid=ytId(src.url), sid=srcId;
    ytLoad().then(()=>{
      if(DK.srcId!==sid) return;
      DK.yt=new YT.Player("ytBox",{videoId:vid,width:"100%",height:"100%",playerVars:{playsinline:1,rel:0},events:{onReady:()=>{
        if(DK.srcId!==sid) return;
        DK.ytReady=true; DK.ready=true;
        if(DK.pend!==null){ DK.yt.seekTo(DK.pend,true); DK.yt.playVideo(); DK.pend=null; }
      }}});
      DK.loopT=setInterval(()=>{ if(DK.ytReady&&DK.a!==null&&DK.b!==null){ try{ if(DK.yt.getCurrentTime()>=DK.b) DK.yt.seekTo(DK.a,true); }catch(e){} } },120);
    });
  }
}
let _ytP=null;
function ytLoad(){
  if(window.YT && YT.Player) return Promise.resolve();
  if(!_ytP) _ytP=new Promise(res=>{ window.onYouTubeIframeAPIReady=res; const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc); });
  return _ytP;
}
function ytLoopLabel(){ const st=document.getElementById("dkSt"); if(!st) return; st.textContent = (DK.a!==null&&DK.b!==null) ? "Loop: "+fmtT(DK.a)+" → "+fmtT(DK.b) : (DK.a!==null?"A at "+fmtT(DK.a)+", now press B":"Loop: not set"); }
function dockRate(r){
  if(DK.kind==="youtube"){ if(DK.ytReady) DK.yt.setPlaybackRate(r); }
  else dockSend({type:"songbook-speed", rate:r});
  const st=document.getElementById("dkSt"); if(st && DK.kind==="instagram" && DK.ready) st.textContent="Speed "+r+"×";
}
function dockToggle(){
  if(DK.kind==="youtube"){ if(!DK.ytReady) return; DK.yt.getPlayerState()===1 ? DK.yt.pauseVideo() : DK.yt.playVideo(); }
  else dockSend({type:DK.paused===false?"songbook-pause":"songbook-play"});
}
function dockSeek(srcId, t, href){
  const song=S.songs.get(S.songId); if(!song) return;
  if(DK.songId!==song.id || DK.srcId!==srcId){ dockOpen(song, srcId, t); if(song.sources.find(x=>x.id===srcId)?.kind==="instagram") DK.pend=t; return; }
  if(DK.kind==="youtube"){ if(DK.ytReady){ DK.yt.seekTo(t,true); DK.yt.playVideo(); } else DK.pend=t; return; }
  if(DK.ready) dockSend({type:"songbook-seek", t:t, pause:true});
  else if(href) window.open(href,"_blank","noopener");
}
document.addEventListener("click", e=>{
  const pl=e.target.closest("[data-play]");
  if(pl){ const song=S.songs.get(S.songId); if(song){ S.srcVer=pl.dataset.play; S.sheetId=null; dockOpen(song, pl.dataset.play); route(); } return; }
  const ls=e.target.closest("[data-listen]");
  if(ls){ listenToggle(ls.dataset.listen); return; }
  const sk=e.target.closest("[data-seek]");
  if(sk){ e.preventDefault(); dockSeek(sk.dataset.src||DK.srcId, +sk.dataset.seek, sk.getAttribute("href")); }
});
window.addEventListener("message", async e=>{
  if(!IG_ORIGIN.test(e.origin)) return;
  const d=e.data; if(!d || typeof d.type!=="string" || !d.type.startsWith("songbook-")) return;
  if(d.type==="songbook-ready" || d.type==="songbook-status"){
    if(!DK.ready){
      DK.ready=true; clearInterval(DK.pingT);
      dockSend({type:"songbook-context", song:DK.songId});
      const st=document.getElementById("dkSt"); if(st) st.textContent="Extension connected";
      if(DK.pend!==null){ dockSend({type:"songbook-seek", t:DK.pend, pause:true}); DK.pend=null; }
      // follow the video time (lit chord) and read the sound once if this version has no chords yet
      clearInterval(DK.timeT); DK.timeT=setInterval(()=>dockSend({type:"songbook-ping"}),250);
      anAuto();
    }
    if(d.type==="songbook-status"){ DK.paused=d.paused; if(typeof d.t==="number"){ DK.t=d.t; heardHighlight(d.t); } }
  } else if(d.type==="songbook-captured"){
    if(!d.dataUrl){ toast("Frame arrived without an image"); return; }
    const song=S.songs.get(DK.songId); if(!song||!S.assets) return;
    const src=(song.sources||[]).find(x=>x.id===DK.srcId);
    try{
      const r=await S.assets.uploadDataUrl(d.dataUrl);
      const entry={assetId:r.id, type:r.contentType, caption:(d.code?d.code+" ":"")+fmtT(d.t||0), t:+(d.t||0), addedAt:new Date().toISOString()};
      if(src){ await addShotTo(song, "src:"+src.id, entry); toast("Frame saved to version “"+verLabel(src, videoVersions(song).indexOf(src))+"”"); }
      else { song.shots=song.shots||[]; song.shots.push(Object.assign({srcCode:d.code||""}, entry)); await saveSong(song); toast("Frame saved to “"+song.title+"”"); }
      route();
    }catch(err){ toast("Couldn't save the frame"); }
  } else if(d.type==="songbook-analyzing" || d.type==="songbook-analyze-failed" || (d.type==="songbook-chords" && d.analyzed)){
    anMessage(d);
  } else if(d.type==="songbook-listening" || d.type==="songbook-chord-live" || d.type==="songbook-chords"){
    listenMessage(d);
  } else if(d.type==="songbook-capture-failed"){
    toast("Capture blocked: "+(d.error||"unknown"));
  }
});
</script>

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function toJpeg(src){
  const img = await loadImg(src);
  let w = img.naturalWidth, h = img.naturalHeight; const max = 1600;
  if(Math.max(w,h) > max){ const k = max / Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,w,h); x.drawImage(img, 0, 0, w, h);
  let q = 0.85, out = c.toDataURL("image/jpeg", q);
  while(out.length > 900000 && q > 0.4){ q -= 0.1; out = c.toDataURL("image/jpeg", q); }
  if(out.length > 900000) throw new Error("image too large");
  return out;
}
async function put(dataUrl, name){
  const id = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  await setDoc(doc(fs, "assets", id), { contentType: "image/jpeg", data: dataUrl, name: name || "", createdAt: new Date().toISOString() });
  return { id, contentType: "image/jpeg" };
}
window.__assets = {
  async upload(file){ const url = URL.createObjectURL(file); try{ return await put(await toJpeg(url), file.name); } finally { URL.revokeObjectURL(url); } },
  async uploadDataUrl(u){ return put(await toJpeg(u), "frame"); },
  async get(id){ const d = await getDoc(doc(fs, "assets", id)); return d.exists() ? d.data().data : null; },
  async delete(id){ await deleteDoc(doc(fs, "assets", id)); }
};
