<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar + one working column; song view = sticky practice toolbar over chord sheet, sources and media below. */
  --bg:#eceef1; --surface:#ffffff; --ink:#15181c; --muted:#5b6470; --line:#d3d8df;
  --accent:#b85a0c; --accent-soft:#f6e4d2; --accent-ink:#ffffff;
  --want:#4b6a8a; --learning:#b85a0c; --know:#2f7d4f;
  --font-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1a1d21; --ink:#e8ebee; --muted:#9aa3ad; --line:#2d3238;
    --accent:#f0913a; --accent-soft:#3a2716; --accent-ink:#1a1006;
    --want:#86a7c8; --learning:#f0913a; --know:#5cc28a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d21; --ink:#e8ebee; --muted:#9aa3ad; --line:#2d3238;
  --accent:#f0913a; --accent-soft:#3a2716; --accent-ink:#1a1006;
  --want:#86a7c8; --learning:#f0913a; --know:#5cc28a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--font-display);font-weight:800;font-stretch:80%;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.datamenu{position:relative;flex:none}
.datamenu summary{list-style:none;cursor:pointer;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.datamenu summary::-webkit-details-marker{display:none}
.tunerbtn{flex:none;background:transparent;border:0;cursor:pointer;font:inherit;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tunerbtn:hover,.datamenu summary:hover{background:var(--accent-soft)}
@media (max-width:520px){ .tunerbtn{padding:7px 8px} .tunerbtn .tl{display:none} }
.tn-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:6px}
.tn-top select{font:inherit;padding:5px 8px;border-radius:8px}
.tn-auto{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-weight:500}
.tn-auto input{position:absolute;opacity:0;pointer-events:none}
.tn-auto i{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.tn-auto i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tn-auto input:checked + i{background:var(--accent)}
.tn-auto input:checked + i::after{left:19px}
.tn-auto input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.tn-gauge{position:relative;max-width:320px;margin:0 auto}
.tn-gauge svg{display:block;width:100%;height:auto}
.tn-arc{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.tn-zone{fill:none;stroke:#1a8a3a;stroke-width:10;opacity:.55}
.tn-tick{stroke:var(--muted);stroke-width:2}
.tn-needle{transform-origin:120px 125px;transition:transform .08s linear;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.tn-needle.ok{stroke:#1a8a3a}
.tn-gauge .tn-read{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.tn-note{font-size:46px;font-weight:700;line-height:1}
.tn-note small{font-size:18px;font-weight:500;color:var(--muted)}
.tn-note.ok{color:#1a8a3a}
.tn-sub{color:var(--muted);font-size:13px;min-height:18px;text-align:center;margin-top:6px}
.tn-head{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.tn-col{display:flex;flex-direction:column;gap:14px}
.tn-peg{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer;position:relative;padding:0}
.tn-peg:hover{border-color:var(--accent)}
.tn-peg.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.tn-peg.ok{border-color:#1a8a3a;background:#1a8a3a;color:#fff}
.tn-pw{position:relative}
.tn-pw .pl{position:absolute;right:-12px;top:-12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;line-height:26px;text-align:center;padding:0;cursor:pointer}
.tn-pw .pl:hover{color:var(--accent);border-color:var(--accent)}
.tn-headsvg{width:120px;height:auto;flex:none}
.tn-headsvg .hs{fill:var(--accent-soft);stroke:var(--muted);stroke-width:2}
.tn-headsvg .st{stroke:var(--muted);stroke-width:1.5}
.tn-headsvg .st.on{stroke:var(--accent);stroke-width:3}
.tn-edit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.tn-edit label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
.tn-edit select{font:inherit;padding:4px}
.tn-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.datamenu>div{position:absolute;right:0;top:100%;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.datamenu>div a{padding:8px 12px;text-decoration:none;color:var(--ink);white-space:nowrap;border-radius:6px}
.datamenu>div a:hover{background:var(--bg)}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;text-align:center;margin-left:4px;line-height:18px}

main{padding:22px 0 80px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted)}
.status-line{font-size:13px;color:var(--muted);min-height:20px}

/* library */
.libhead{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.libhead h1{font-size:32px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters input{flex:1 1 220px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;border-left:4px solid var(--line)}
.card[data-content="both"]{border-left-color:var(--know)}
.card[data-content="chords"]{border-left-color:var(--learning)}
.card[data-content="tabs"]{border-left-color:var(--want)}
.pill.both{background:var(--know)} .pill.chords{background:var(--learning)} .pill.tabs{background:var(--want)} .pill.none{background:transparent;color:var(--muted);border:1px solid var(--line)}
.card:hover{border-color:var(--muted)}
.card[data-status="want"]{border-left-color:var(--want)}
.card[data-status="learning"]{border-left-color:var(--learning)}
.card[data-status="know"]{border-left-color:var(--know)}
.card h3{font-size:19px}
.card .artist{color:var(--muted);font-size:14px;margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--font-mono);font-size:12px;padding:1px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.meta{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:auto}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;color:#fff}
.pill.want{background:var(--want)} .pill.learning{background:var(--learning)} .pill.know{background:var(--know)}
:root[data-theme="dark"] .pill, .dark-pill{color:#111}

/* song */
.songhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin-bottom:14px}
.songhead h1{font-size:38px}
.songhead .artist{font-size:17px;color:var(--muted)}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.fact{display:flex;flex-direction:column}
.fact b{font-family:var(--font-mono);font-size:16px}
.fact span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toolbar{position:sticky;top:56px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tool{display:flex;align-items:center;gap:6px}
.tool label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tool output{font-family:var(--font-mono);font-weight:700;min-width:30px;text-align:center}
.tool input[type=range]{width:90px;accent-color:var(--accent)}
.tool input[type=number]{width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.beat{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .05s}
.beat.on{background:var(--accent)}
.capohelp{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.capohelp button{font-size:12px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.songhead h1{font-size:30px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:16px}
.panel h2{font-size:20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet{direction:ltr}
.section{margin-bottom:18px}
.section:last-child{margin-bottom:0}
.secname{font-family:var(--font-display);font-stretch:80%;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--accent);margin-bottom:4px}
.cline{font-family:var(--font-mono);font-size:17px;white-space:pre-wrap;line-height:2;overflow-x:auto}
.cline .ch{font:inherit;font-weight:700;color:var(--ink);background:var(--accent-soft);border:0;border-radius:5px;padding:1px 6px;cursor:pointer}
.cline .ch:hover{background:var(--accent);color:var(--accent-ink)}
.snote{font-size:14px;color:var(--muted);font-style:italic;margin:2px 0}
.fsheet{font-family:var(--font-mono);font-size:15px;line-height:1.45;overflow-x:auto}
.fsheet > div{white-space:pre;unicode-bidi:plaintext;min-height:1.45em}
.fsheet[dir="rtl"] > div{unicode-bidi:isolate;text-align:right}
.fsheet .fch{color:var(--accent);font-weight:700;margin-top:6px}
.fsheet .fch .chw{cursor:pointer;border-radius:3px;display:inline-block;white-space:pre}
.fsheet .fch .chw:hover,.fsheet .fch .chw:focus-visible{background:var(--accent);color:var(--accent-ink)}
.fsheet .fly{font-family:var(--font-mono)}
.fsheet .fsec{font-family:var(--font-display);font-stretch:80%;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);margin-top:16px;white-space:normal}
.fsheet .ftab{color:var(--muted);font-size:13px;direction:ltr;text-align:left}
.fsheet.is-tab .ftab{color:var(--ink);font-size:14px}
.sheettabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;border-bottom:1px solid var(--line);margin-bottom:0}
.sheettabs button.st{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;margin-bottom:-1px}
.sheettabs button.st small{font-weight:400;font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheettabs button.st[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.sheettabs .add{margin:0 0 6px 6px}
.sheetpanel{border-top-left-radius:0;margin-bottom:16px}
.sheetbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 6px;box-shadow:0 8px 24px rgb(0 0 0 / .18);pointer-events:none;display:none;text-align:center}
.pop b{font-family:var(--font-mono);display:block;font-size:15px}
.pop .frets{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pastegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.pastegrid{grid-template-columns:1fr}}
.fillgrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.fillgrid{grid-template-columns:minmax(0,1fr)}}
.vers{display:flex;flex-direction:column;gap:6px}
.ver{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.ver span{color:var(--muted);font-size:13px}
.ver.on{border-color:var(--accent);background:var(--accent-soft)}
.ver:hover{border-color:var(--accent)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.mini{flex:none;display:flex;flex-direction:column;align-items:center;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini b{font-family:var(--font-mono);font-size:14px}
.empty-sheet{color:var(--muted)}

.src{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.src:first-of-type{border-top:0;padding-top:0}
.src .t{display:flex;gap:8px;align-items:center;justify-content:space-between}
.src a.title{font-weight:600;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.src a.title:hover{color:var(--accent)}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);flex:none}
.marks{display:flex;flex-wrap:wrap;gap:5px}
.mark{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);display:inline-flex;gap:5px}
.mark b{font-family:var(--font-mono)}
.mark.tab{border-color:var(--accent)}
a.mark:hover{background:var(--accent-soft)}

textarea.tabs{width:100%;min-height:180px;font-family:var(--font-mono);font-size:13px;line-height:1.35;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);direction:ltr;white-space:pre;overflow:auto;resize:vertical}
.vh{display:flex;align-items:center;gap:8px;font-size:15px;margin:16px 0 8px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.shot img,.shot video{width:100%;display:block;cursor:zoom-in}
.shot .cap{font-size:12px;padding:5px 7px;display:flex;justify-content:space-between;gap:6px;align-items:center}
textarea.notes{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

/* chord explorer + voicing grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);cursor:pointer}
.vcard:hover{border-color:var(--accent)}
.vcard .lbl{font-size:11px;color:var(--muted);text-align:center}
.vcard .frets{font-family:var(--font-mono);font-size:12px}
.vcard.first{border-color:var(--accent)}
.cvlist{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.cvshot{margin:0;width:220px}
.cvshot canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.cvshot figcaption{font-size:12px;color:var(--muted)}
.cvout label{display:block;margin-top:10px}
.cvout textarea{display:block;width:100%;min-height:150px;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--font-mono);font-size:13px;white-space:pre;overflow-x:auto}
.vwrap{display:flex;flex-direction:column;gap:4px}
.vwrap .vcard{flex:1}
.vcard.mine{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.vwrap .vuse{font-size:11px;padding:2px 4px}
.picker{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.keys{display:flex;flex-wrap:wrap;gap:4px}
.keys button{min-width:42px;padding:6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--font-mono);font-weight:600}
.keys button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* pending */
.pend{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.pend h3{font-size:20px}
.cand{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.cand .info{display:flex;flex-direction:column;gap:4px}
.cand pre{margin:6px 0 0;font-family:var(--font-mono);font-size:13px;white-space:pre-wrap;color:var(--muted)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dhead h2{font-size:24px}
.dbody{padding:16px 18px;overflow:auto}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
.form .wide{grid-column:1/-1}
textarea.sheetedit{min-height:300px;font-family:var(--font-mono);font-size:14px;direction:ltr;white-space:pre}
.help{font-size:13px;color:var(--muted)}
.help code{font-family:var(--font-mono);background:var(--bg);padding:0 4px;border-radius:4px}
.markrow{display:grid;grid-template-columns:80px 1fr 110px auto;gap:6px;margin-bottom:6px}
.markrow input,.markrow select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[dir="rtl"].he{font-family:var(--font-body)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.wrap{padding:0 14px}.brand span{display:none}.toolbar{gap:10px}.markrow{grid-template-columns:70px 1fr}}

/* ---- gate + dock ---- */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:360px;text-align:center}
#gate h1{font-size:26px;margin-bottom:6px}
#dock{position:fixed;right:14px;bottom:14px;width:min(380px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:30;display:none}
#dock.on{display:block}
#dock .dh{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
#dock .dh .tt{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock .dh select{max-width:130px;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px}
#dock.min .dbody{display:none}
#dock .media{position:relative;width:100%;background:#000}
#dock iframe{width:100%;height:520px;border:0;display:block;background:#fff}
#dock .yt{aspect-ratio:16/9}
#dock .yt iframe,#dock .yt div{width:100%;height:100%}
#dock .ctl{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;align-items:center}
#dock .ctl .btn{padding:3px 8px;font-size:12px}
#dock .st{padding:0 10px 8px;font-size:12px;color:var(--muted)}
#dock .marks{padding:0 10px 10px}
button.mark{background:transparent;cursor:pointer;font:inherit;font-size:12px}
button.mark:hover{background:var(--accent-soft)}
.shot img{width:100%;display:block}
/* the player never covers the page: a side column on wide screens, a small corner card in between, a bottom strip on phones */
@media (min-width:1180px){
  #dock{top:57px;right:0;bottom:0;width:380px;max-height:none;border-radius:0;border-width:0 0 0 1px;box-shadow:none}
  #dock iframe{height:calc(100vh - 200px);min-height:420px;max-height:760px}
  body.dock-on:not(.dock-min) main{padding-right:380px}
  #dock.min{top:auto;bottom:14px;right:14px;width:300px;border-width:1px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
}
@media (max-width:1179px){ #dock{width:min(330px,calc(100vw - 28px))} #dock iframe{height:400px} }
@media (max-width:700px){
  #dock{left:0;right:0;bottom:0;width:auto;border-radius:12px 12px 0 0;max-height:52vh}

}

<script>
// ===== Chord engine: parsing, transposition, voicing generation =====
const NOTE_SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const NOTE_PC = {C:0,"B#":0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,Fb:4,"E#":5,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11,Cb:11};
const TUNING = [40,45,50,55,59,64]; // E2 A2 D3 G3 B3 E4 (low → high)
const STRING_NAMES = ["E","A","D","G","B","e"];

// quality → {iv: all chord tones (semitones), req: tones that must sound}
const QUALITIES = [
  [/^(maj|M)?$/,            {iv:[0,4,7],        req:[0,4],        name:"major"}],
  [/^(m|min|-)$/,           {iv:[0,3,7],        req:[0,3],        name:"minor"}],
  [/^5$/,                   {iv:[0,7],          req:[0,7],        name:"power chord"}],
  [/^7$/,                   {iv:[0,4,7,10],     req:[0,4,10],     name:"dominant 7"}],
  [/^(maj7|M7|Δ|Δ7|ma7)$/,  {iv:[0,4,7,11],     req:[0,4,11],     name:"major 7"}],
  [/^(m7|min7|-7)$/,        {iv:[0,3,7,10],     req:[0,3,10],     name:"minor 7"}],
  [/^(mMaj7|mM7|m\(maj7\)|mmaj7)$/,{iv:[0,3,7,11],req:[0,3,11],   name:"minor-major 7"}],
  [/^(m7b5|ø|ø7|min7b5)$/,  {iv:[0,3,6,10],     req:[0,3,6,10],   name:"half-diminished"}],
  [/^(dim|°|o)$/,           {iv:[0,3,6],        req:[0,3,6],      name:"diminished"}],
  [/^(dim7|°7|o7)$/,        {iv:[0,3,6,9],      req:[0,3,6,9],    name:"diminished 7"}],
  [/^(aug|\+)$/,            {iv:[0,4,8],        req:[0,4,8],      name:"augmented"}],
  [/^(aug7|\+7|7#5)$/,      {iv:[0,4,8,10],     req:[0,4,8,10],   name:"augmented 7"}],
  [/^sus2$/,                {iv:[0,2,7],        req:[0,2],        name:"suspended 2"}],
  [/^(sus4|sus)$/,          {iv:[0,5,7],        req:[0,5],        name:"suspended 4"}],
  [/^7sus4?$/,              {iv:[0,5,7,10],     req:[0,5,10],     name:"7 suspended 4"}],
  [/^6$/,                   {iv:[0,4,7,9],      req:[0,4,9],      name:"major 6"}],
  [/^(m6|min6)$/,           {iv:[0,3,7,9],      req:[0,3,9],      name:"minor 6"}],
  [/^(add9|add2|2)$/,       {iv:[0,2,4,7],      req:[0,2,4],      name:"add 9"}],
  [/^(madd9|madd2|m2)$/,    {iv:[0,2,3,7],      req:[0,2,3],      name:"minor add 9"}],
  [/^9$/,                   {iv:[0,2,4,7,10],   req:[0,2,4,10],   name:"dominant 9"}],
  [/^(maj9|M9)$/,           {iv:[0,2,4,7,11],   req:[0,2,4,11],   name:"major 9"}],
  [/^(m9|min9)$/,           {iv:[0,2,3,7,10],   req:[0,2,3,10],   name:"minor 9"}],
  [/^(6\/9|69)$/,           {iv:[0,2,4,7,9],    req:[0,2,4,9],    name:"6/9"}],
  [/^(7b9)$/,               {iv:[0,1,4,7,10],   req:[0,1,4,10],   name:"7 flat 9"}],
  [/^(11)$/,                {iv:[0,2,5,7,10],   req:[0,5,10],     name:"dominant 11"}],
  [/^(m11|min11)$/,         {iv:[0,2,3,5,7,10], req:[0,3,5,10],   name:"minor 11"}],
  [/^(13)$/,                {iv:[0,2,4,7,9,10], req:[0,4,9,10],   name:"dominant 13"}],
  [/^(add11|add4)$/,        {iv:[0,4,5,7],      req:[0,4,5],      name:"add 11"}],
  [/^(madd11)$/,            {iv:[0,3,5,7],      req:[0,3,5],      name:"minor add 11"}],
];

const CHORD_RE = /^([A-G])([#b]?)([^\/\s]*)(?:\/([A-G][#b]?))?$/;

function parseChord(sym){
  const six9 = /6\/9/.test(sym);
  const m = CHORD_RE.exec(six9 ? sym.replace("6/9","69") : sym);
  if(!m) return null;
  const root = NOTE_PC[m[1]+m[2]];
  if(root===undefined) return null;
  const qs = m[3];
  let q = null;
  for(const [re,def] of QUALITIES){ if(re.test(qs)){ q = def; break; } }
  if(!q) return null;
  let bass = null;
  if(m[4]){ bass = NOTE_PC[m[4]]; if(bass===undefined) return null; }
  return {sym, rootName:m[1]+m[2], root, quality: six9 ? qs.replace("69","6/9") : qs, q, bassName:m[4]||null, bass};
}
function isChord(tok){ return parseChord(tok)!==null; }

function noteName(pc, flats){ return (flats?NOTE_FLAT:NOTE_SHARP)[((pc%12)+12)%12]; }
function transposeChord(sym, n, flats){
  const p = parseChord(sym); if(!p || !n) return sym;
  let s = noteName(p.root+n, flats) + p.quality;
  if(p.bassName) s += "/" + noteName(p.bass+n, flats);
  return s;
}
// keys that conventionally use flats
const FLAT_KEYS = new Set(["F","Bb","Eb","Ab","Db","Gb","Dm","Gm","Cm","Fm","Bbm","Ebm"]);
function prefersFlats(key, n){
  if(!key) return false;
  const p = parseChord(key); if(!p) return false;
  const k = noteName(p.root+(n||0), true) + (p.quality.startsWith("m")?"m":"");
  return FLAT_KEYS.has(k);
}

// standard shapes guitarists expect to see first
const STANDARD = {
  C:"x32010",D:"xx0232",E:"022100",G:"320003",A:"x02220",F:"133211",B:"x24442",Bb:"x13331",
  Am:"x02210",Em:"022000",Dm:"xx0231",Bm:"x24432","F#m":"244222",Cm:"x35543",Gm:"355333",Fm:"133111","C#m":"x46654",
  E7:"020100",A7:"x02020",D7:"xx0212",G7:"320001",C7:"x32310",B7:"x21202",
  Am7:"x02010",Em7:"020000",Dm7:"xx0211",Cmaj7:"x32000",Fmaj7:"xx3210",Amaj7:"x02120",Dmaj7:"xx0222",Gmaj7:"320002",
  Asus2:"x02200",Asus4:"x02230",Dsus2:"xx0230",Dsus4:"xx0233",Esus4:"022200",Cadd9:"x32030",
  E5:"022xxx",A5:"x022xx",D5:"xx023x",G5:"355xxx",F5:"133xxx"
};
function fretKey(fr){ return fr.map(f=>f<0?"x":f).join(""); }

// ---- Voicing generator ----
function generateVoicings(sym, opts={}){
  const p = parseChord(sym); if(!p) return [];
  const pcs = new Set(p.q.iv.map(i => (p.root+i)%12));
  const req = p.q.req.map(i => (p.root+i)%12);
  const bassPc = p.bass!==null ? p.bass : p.root;
  pcs.add(bassPc);
  const isPower = p.q.iv.length===2;
  const minStrings = isPower ? 2 : 4;
  const seen = new Set(); const out = [];

  for(let base=0; base<=12; base++){
    const lo = Math.max(1, base), hi = base===0 ? 3 : base+3;
    const allowOpen = base<=5;
    const opts6 = TUNING.map(open => {
      const o = [-1];
      if(allowOpen && pcs.has(open%12)) o.push(0);
      for(let f=lo; f<=hi; f++) if(pcs.has((open+f)%12)) o.push(f);
      return o;
    });
    const cur = new Array(6);
    (function rec(s){
      if(s===6){ check(cur.slice()); return; }
      for(const f of opts6[s]){ cur[s]=f; rec(s+1); }
    })(0);
  }

  function check(fr){
    const sounding = []; for(let s=0;s<6;s++) if(fr[s]>=0) sounding.push(s);
    if(sounding.length < minStrings) return;
    // bass = lowest sounding string
    const low = sounding[0];
    if((TUNING[low]+fr[low])%12 !== bassPc) return;
    // mutes: only below the bass, at most one inside, at most one on top
    const top = sounding[sounding.length-1];
    let inner = 0; for(let s=low; s<=top; s++) if(fr[s]<0) inner++;
    if(inner>1) return;
    if(!isPower && 5-top > 1) return;
    if(inner && sounding.length<4) return;
    // required tones
    const have = new Set(sounding.map(s => (TUNING[s]+fr[s])%12));
    for(const r of req) if(!have.has(r)) return;
    // span & fingers
    const fretted = sounding.filter(s => fr[s]>0);
    if(fretted.length){
      const mn = Math.min(...fretted.map(s=>fr[s])), mx = Math.max(...fretted.map(s=>fr[s]));
      if(mx-mn>3) return;
      const atMin = fretted.filter(s=>fr[s]===mn);
      let barre = null, fingers;
      if(atMin.length>=2){
        // barre from first string at min fret to the top sounding string; nothing open/muted under it
        const from = atMin[0];
        let ok = true; for(let s=from; s<=top; s++) if(fr[s] < mn) { ok=false; break; }
        if(ok){ barre = {fret:mn, from, to:top}; }
      }
      if(barre) fingers = 1 + fretted.filter(s => fr[s]>mn).length;
      else fingers = fretted.length;
      if(fingers>4) return;
      if(fr.some(f=>f===0) && mx>=5) return; // open strings + high shape: not practical
      // with open strings + high fretted notes, keep playable (no open strings when fretting above 7 unless shape is small)
      const key = fr.join(",");
      if(seen.has(key)) return; seen.add(key);
      out.push(build(fr, sounding, fretted, mn, mx, barre, have));
    } else {
      const key = fr.join(","); if(seen.has(key)) return; seen.add(key);
      out.push(build(fr, sounding, fretted, 0, 0, null, have));
    }
  }

  function build(fr, sounding, fretted, mn, mx, barre, have){
    const opens = sounding.filter(s=>fr[s]===0).length;
    const mutes = 6 - sounding.length;
    let kind;
    if(opens && mx<=4 && mn<=3) kind = "open";
    else if(barre && sounding.length>=5) kind = "barre";
    else if(sounding.length<=4) kind = "compact";
    else kind = "barre";
    if(kind==="barre" && !barre) kind = "moveable";
    const low = sounding[0];
    const rootOn = 6 - low; // string number (6 = low E)
    const fingers = assignFingers(fr, barre);
    const allTones = p.q.iv.every(i => have.has((p.root+i)%12));
    // score: lower = better (used for "most common" ordering)
    let score = mn*1.0 + mutes*2.5 + (allTones?0:2) + (kind==="open"?-3:0) + (barre?1:0)
      + fingers.filter(f=>f).length*0.4;
    if(opens && mx>=5) score += 4;          // open strings far from the fretted shape
    if(fr[5]<0 && !isPower) score += 3;
    for(let s=1;s<5;s++) if(fr[s]===0 && fr.slice(0,s).some(f=>f>=3) && fr.slice(s+1).some(f=>f>=2)) score += 1.5;
    if(barre && sounding.length>=5 && (low===0||low===1)) score -= 1.5;
    const std = STANDARD[noteName(p.root,false)+p.quality] || STANDARD[noteName(p.root,true)+p.quality];
    if(!p.bassName && std && std===fretKey(fr)) score -= 20;                 // high e muted
    if(fretted.length===0) score += 0;
    // inner mutes are harder to strum
    for(let s=low; s<=sounding[sounding.length-1]; s++) if(fr[s]<0) score+=3;
    const posFret = fretted.length ? mn : 0;
    return {frets:fr, fingers, barre, kind, rootOn, posFret, score, mutes, opens,
      notes: fr.map((f,s)=> f<0?null: noteName(TUNING[s]+f, false)),
      roots: fr.map((f,s)=> f>=0 && (TUNING[s]+f)%12===p.root)};
  }

  // drop a voicing when another one is identical but rings on more strings
  const nf = v => v.barre ? 1 + v.frets.filter(f=>f>v.barre.fret).length : v.frets.filter(f=>f>0).length;
  const pruned = out.filter(a => !out.some(b => b!==a && b.mutes < a.mutes && nf(b) <= nf(a) &&
      a.frets.every((f,i)=> f<0 || f===b.frets[i])));
  pruned.sort((a,b)=> a.score-b.score);
  return pruned;
}

function assignFingers(fr, barre){
  const fingers = [0,0,0,0,0,0];
  let next = 1;
  if(barre){ for(let s=barre.from; s<=barre.to; s++) if(fr[s]===barre.fret) fingers[s]=1; next = 2; }
  const rest = [];
  for(let s=0;s<6;s++) if(fr[s]>0 && !fingers[s]) rest.push(s);
  rest.sort((a,b)=> fr[a]-fr[b] || a-b);
  // if no barre, finger 1 goes on the lowest fret
  for(const s of rest){ fingers[s] = Math.min(4, next++); }
  return fingers;
}

if(typeof module!=="undefined") module.exports = {parseChord, isChord, transposeChord, generateVoicings, noteName, prefersFlats, NOTE_PC};

// ===== Paste cleaner: turns a copied web page (UG, Tab4u, …) into a clean chord+lyrics sheet =====
// Needs: isChordLine(line) from the page.
const SECTION_WORDS = /^(intro|verse|pre[- ]?chorus|chorus|bridge|outro|solo|guitar solo|interlude|instrumental|refrain|hook|coda|break|riff|ending|post[- ]?chorus|פתיחה|אינטרו|בית|פזמון|גשר|מעבר|סולו|סיום|קודה|מעבר מוזיקלי)(\s*\d+)?(\s*\(.*\))?$/i;
const END_MARKERS = [
  /^last update:/i, /^please,? rate this tab/i, /^rating$/i, /^related tabs$/i, /^more versions$/i,
  /^\d+\s+comments?$/i, /^what do you think about this tab\??$/i, /^unregistered$/i, /^all artists$/i,
  /^©/, /^print$/i, /^report bad tab$/i, /^welcome offer/i,
  /^הוסף תגובה/, /^תגובות/, /^שירים נוספים של/, /^דווח על טעות/, /^הדפס/
];
const META = [
  [/^capo:\s*(.+)$/i, "capo"], [/^קאפו:?\s*(.+)$/, "capo"],
  [/^key:\s*(.+)$/i, "key"], [/^tuning:\s*(.+)$/i, "tuning"],
  [/^difficulty:\s*(.+)$/i, "difficulty"], [/^.*difficulty:\s*(\w+)\s*$/i, "difficulty"],
  [/^tempo:\s*(\d+)/i, "bpm"], [/^bpm:\s*(\d+)/i, "bpm"],
  [/^strumming:\s*(.+)$/i, "strum"]
];
const TABLINE = l => /^\s*[eBGDAEbgda]\s*[|:][-0-9hpbrsxv\/\\~^|().* ]{4,}\s*$/.test(l) && /-{2,}/.test(l);
function parseCapo(v){
  v = String(v).toLowerCase();
  if(/no capo|none|ללא|בלי/.test(v)) return 0;
  const m = /(\d+)/.exec(v); return m ? Math.min(12, +m[1]) : null;
}
function sectionHeader(line){
  const t = line.trim();
  let m = /^\[([^\]]+)\]$/.exec(t); if(m) return m[1].trim();
  m = /^([^:]{2,30}):$/.exec(t); if(m && SECTION_WORDS.test(m[1].trim())) return m[1].trim();
  if(SECTION_WORDS.test(t) && t.length < 30) return t;
  return null;
}
function cleanSheet(raw){
  const src = String(raw||"").replace(/\r/g,"").replace(/ /g," ").replace(/\t/g,"    ");
  const lines = src.split("\n");
  const meta = {};
  const isUG = /ultimate-guitar|UG guitarists|Publish tab|chords and tabs/i.test(src);
  const isTab4u = /tab4u/i.test(src);
  // ---- find the body ----
  let start = -1;
  for(let i=0;i<lines.length;i++){
    const t = lines[i].trim();
    for(const [re,key] of META){ const m=re.exec(t); if(m && meta[key]===undefined) meta[key]=m[1].trim(); }
    if(start<0 && (sectionHeader(lines[i]) || isChordLine(lines[i]) || TABLINE(lines[i]))){ start=i; }
    if(start>=0) break;
  }
  if(start<0) return {text: src.trim(), meta, removed:0, source: isUG?"Ultimate Guitar":isTab4u?"Tab4u":null, found:false};
  let end = lines.length;
  for(let i=start+1;i<lines.length;i++){
    const t = lines[i].trim();
    if(END_MARKERS.some(re=>re.test(t))){ end=i; break; }
    if(t==="X"){ // UG close button right before the footer
      const nxt = lines.slice(i+1).find(l=>l.trim()); if(!nxt || END_MARKERS.some(re=>re.test(nxt.trim()))){ end=i; break; }
    }
  }
  // stop after the last chord line + the lyric line under it (drops trailing site text)
  let lastChord=-1; for(let i=start;i<end;i++) if(isChordLine(lines[i]) || TABLINE(lines[i])) lastChord=i;
  if(lastChord>=0){
    let cut = lastChord+1;
    const under = lines[cut];
    if(under!==undefined && under.trim() && !isChordLine(under) && !sectionHeader(under) && !TABLINE(lines[lastChord]) && cut<end) cut++;
    // keep tab blocks that follow
    while(cut<end && /^\s*[eBGDAEbgda]\s*[|:]/.test(lines[cut])) cut++;
    end = Math.min(end, cut);
  }
  // meta lines that sit after the body start (some sites put Capo inside)
  // ---- clean the body ----
  const out=[];
  for(let i=start;i<end;i++){
    let l = lines[i].replace(/\s+$/,"");
    const t = l.trim();
    for(const [re,key] of META){ const m=re.exec(t); if(m){ if(meta[key]===undefined) meta[key]=m[1].trim(); l=null; break; } }
    if(l===null) continue;
    const sec = sectionHeader(l);
    if(sec){ while(out.length && out[out.length-1]==="") out.pop(); if(out.length) out.push(""); out.push("["+sec+"]"); continue; }
    if(!t){ if(out.length && out[out.length-1]!=="" && !/^\[.*\]$/.test(out[out.length-1])) out.push(""); continue; }
    out.push(l);
  }
  while(out.length && out[out.length-1]==="") out.pop();
  // drop the indent every line shares
  const ind = Math.min(...out.filter(l=>l.trim() && !/^\[.*\]$/.test(l)).map(l=>l.match(/^ */)[0].length));
  const text = (isFinite(ind) && ind>0 ? out.map(l=>/^\[.*\]$/.test(l)?l:l.slice(ind)) : out).join("\n");
  const nTab = out.filter(TABLINE).length, nCh = out.filter(isChordLine).length;
  const res = {text, kind: nTab > nCh ? "tab" : "chords", meta:{}, removed: lines.length - out.length, source: isUG?"Ultimate Guitar":isTab4u?"Tab4u":null, found:true};
  if(meta.capo!==undefined){ const c=parseCapo(meta.capo); if(c!==null) res.meta.capo=c; }
  if(meta.key) res.meta.key = meta.key.split(/\s/)[0];
  if(meta.tuning) res.meta.tuning = meta.tuning;
  if(meta.difficulty) res.meta.difficulty = meta.difficulty;
  if(meta.bpm) res.meta.bpm = +meta.bpm;
  if(meta.strum) res.meta.strum = meta.strum;
  return res;
}
if(typeof module!=="undefined") module.exports = {cleanSheet, sectionHeader};

<script>
"use strict";
// ================= state =================
const S = {
  db:null, assets:null, songs:new Map(), pending:[], loaded:false, offline:false,
  transpose:0, viewCapo:null, flats:null, songId:null,
  chordRoot:"C", chordQual:"", vfilter:"all"
};
const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hasHeb = s => /[֐-׿]/.test(s||"");

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

function fmtT(t){ t=Math.max(0,Math.round(+t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function parseT(s){ s=String(s||"").trim(); if(!s) return null; if(/^\d+$/.test(s)) return +s; const m=/^(\d+):(\d{1,2})$/.exec(s); return m? (+m[1])*60+(+m[2]) : null; }

// ================= persistence =================
const writing = new Map();
async function saveSong(song){

  S.songs.set(song.id, song);
  if(!S.db){ return; }
  const id = song.id;
  const prev = writing.get(id) || Promise.resolve();
  const p = prev.then(() => S.db.doc("songs/"+id).set(JSON.parse(JSON.stringify(song))))
    .catch(e => { toast(e && e.code==="quota_exceeded" ? "Storage is full: delete some songs or files." : "Couldn't save. Check your connection and try again."); });
  writing.set(id, p); return p;
}
async function deleteSong(id){ S.songs.delete(id); if(S.db) await S.db.doc("songs/"+id).delete().catch(()=>toast("Couldn't delete.")); }
async function deletePending(id){ S.pending = S.pending.filter(p=>p.id!==id); if(S.db) await S.db.doc("pending/"+id).delete().catch(()=>{}); }

async function init(){
  route();
  const timer = setTimeout(()=>{ if(!S.loaded){ S.offline=true; route(); } }, 10000);
  let db = null;
  db = window.__db || null; S.assets = window.__assets || null;
  if(!db){ clearTimeout(timer); S.loaded=true; S.offline=true; route(); return; }
  S.db = db;
  db.collection("songs").onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const v=d.data(); if(v) m.set(d.id, Object.assign({id:d.id}, v)); });
    S.songs = m;
    if(!snap.metadata.fromCache){ S.loaded=true; S.offline=false; clearTimeout(timer); }

  }, () => { clearTimeout(timer); S.loaded=true; S.offline=true; route(); });
  db.collection("ugv").onSnapshot(snap => {
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); S.ugv=m; softRefresh();
  }, () => {});
  db.collection("pending").onSnapshot(snap => {
    S.pending = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    softRefresh();
  }, () => {});
}
// re-render without losing focus inside text areas
function softRefresh(){
  const b = $("#pendBadge"); b.hidden = !S.pending.length; b.textContent = S.pending.length;
  const a = document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="range" && a.type!=="button"))) return;
  if($("#dlg").open) return;

}

// ================= routing =================
window.addEventListener("hashchange", () => { stopScroll(); route(true); });
function route(nav){
  if(typeof hidePop==="function" && document.getElementById("pop")) hidePop();
  const h = location.hash.slice(1) || "library";
  let tab = h==="fill" ? "library" : h;
  if(h.startsWith("song-")){ tab="library"; const id=h.slice(5); if(S.songId!==id){ S.songId=id; S.transpose=0; S.viewCapo=null; S.flats=null; P.tempo=null; P.feel=1; S.sheetId=null; stopPlayer(); } }
  document.querySelectorAll("[data-nav]").forEach(a => a.setAttribute("aria-current", a.dataset.nav===tab ? "page" : "false"));
  const v = $("#view");
  if(h.startsWith("song-")) renderSong(v, h.slice(5));
  else if(h==="chords") renderChords(v);
  else if(h==="pending") renderPending(v);
  else if(h==="fill") renderFill(v);
  else renderLibrary(v);
  if(nav) window.scrollTo(0,0);

}

// ================= chord helpers =================
const CHORD_TOKEN = /^\(?([A-G][#b]?(?:[^\s\/|()]*?6\/9|[^\s\/|()]*?)(?:\/[A-G][#b]?)?)\)?$/;
function chordTokens(line){ return line.split(/(\s+)/); }
const _cleanCache = new Map();
function cleanText(raw){
  raw = raw||""; if(!raw) return "";
  if(!_cleanCache.has(raw)){ const r = cleanSheet(raw); _cleanCache.set(raw, r.found ? r.text : raw); }
  return _cleanCache.get(raw);
}
// every version of a song is a "sheet": {id, kind:"chords"|"tab", label, text, capo, source, url, tuning}
function getSheets(song){
  if(Array.isArray(song.sheets)) return song.sheets;
  const out=[];
  if(song.sheetText) out.push({id:"sheet1", kind:"chords", label:"", text:cleanText(song.sheetText), capo: song.sheetCapo!==undefined? +song.sheetCapo : (+song.capo||0), source:song.sheetSource||""});
  if((song.sections||[]).length) out.push({id:"chart", kind:"chords", label:"Chart", text:serializeSheet(song), capo:+song.capo||0});
  (song.altSheets||[]).forEach((a,i)=>out.push({id:"alt"+i, kind:"chords", label:a.label||"", text:serializeSheet({sections:a.sections||[]}), capo:+song.capo||0}));
  if(song.myTab) out.push({id:"tab1", kind:"tab", label:"", text:song.myTab, capo:+song.capo||0});
  return out;
}
function migrate(song){
  if(Array.isArray(song.sheets)) return;
  song.sheets = getSheets(song);
  for(const k of ["sections","altSheets","sheetText","sheetCapo","sheetSource","myTab"]) delete song[k];
}
function sheetName(sheets, sh){
  const same = sheets.filter(x=>x.kind===sh.kind); const i = same.indexOf(sh)+1;
  return (sh.kind==="tab"?"Tabs ":"Chords ") + i;
}
function chordsOfText(txt, set=[]){
  for(const line of cleanText(txt).split("\n")){ if(line.startsWith(">") || !isChordLine(line)) continue;
    for(const tok of line.trim().split(/\s+/)){ const m=CHORD_TOKEN.exec(tok); if(m && isChord(m[1]) && !set.includes(m[1])) set.push(m[1]); } }
  return set;
}
function chordsOfSong(song){
  const set=[]; for(const sh of getSheets(song)) chordsOfText(sh.text, set);
  for(const sec of song.sections||[]) chordsOfText((sec.lines||[]).join("\n"), set);
  return set;
}
const BAR_TOKEN = /^(\||\|\||\.|-|\/|x\d+|\(x\d+\)|\d+x|%|:\|\||\|\|:|N\.?C\.?|\(|\))$/i;
function isChordLine(line){
  const toks=line.trim().split(/\s+/).filter(Boolean); if(!toks.length) return false;
  let ch=0; for(const t of toks){ const m=CHORD_TOKEN.exec(t); if(m && isChord(m[1])) ch++; else if(!BAR_TOKEN.test(t)) return false; }

}
const isTabLine = l => /^\s*[eBGDAEbgda]\s*[|:]?[-0-9hpbrs\/\\~x|() ]{6,}$/.test(l) && /-{3,}/.test(l);
// transpose a chord line keeping each chord at its column
function shiftChordLine(line, n, flats){
  const out=[]; let debt=0; const parts=line.split(/(\s+)/);
  for(const p of parts){
    if(!p) continue;
    if(/^\s+$/.test(p)){ let len=p.length-debt; debt=0; if(len<1){ debt=1-len; len=1; } out.push({t:" ".repeat(len)}); continue; }
    const m=CHORD_TOKEN.exec(p);
    if(m && isChord(m[1])){ const tc=tChord(m[1],n,flats); const txt=p.replace(m[1],tc); debt+=txt.length-p.length; out.push({t:txt, chord:tc, raw:m[1]}); }
    else out.push({t:p});
  }
  // negative debt means we got shorter: pad back nothing (alignment stays from the left/start)
  return out;
}
function fullSheetHTML(text, rtl, n, flats, kind){
  const lines = cleanText(text).split("\n");
  return `<div class="fsheet ${kind==="tab"?"is-tab":""}" dir="${rtl?"rtl":"ltr"}">${lines.map(line=>{
    const sec=/^\s*\[([^\]]+)\]\s*$/.exec(line);
    if(sec) return `<div class="fsec">${esc(sec[1])}</div>`;
    if(line.startsWith(">")) return `<div class="snote" dir="auto">${esc(line.slice(1).trim())}</div>`;
    if(isTabLine(line)) return `<div class="ftab" dir="ltr">${esc(line)}</div>`;
    if(isChordLine(line)) return `<div class="fch">${shiftChordLine(line,n,flats).map(p=>p.chord?`<span class="chw" data-chord="${esc(p.chord)}" tabindex="0">${esc(p.t)}</span>`:esc(p.t)).join("")||"&nbsp;"}</div>`;
    return `<div class="fly">${esc(line)||"&nbsp;"}</div>`;
  }).join("")}</div>`;
}
function shift(song){ const c=(S.viewCapo===null? (+song.capo||0) : S.viewCapo); return (+song.capo||0) - c + S.transpose; }
function useFlats(song){ return S.flats!==null ? S.flats : prefersFlats(song.key, S.transpose) || /b/.test((chordsOfSong(song).join(" ").match(/[A-G]b/)||[""])[0]); }
function tChord(sym, n, flats){ return transposeChord(sym, n, flats); }

// fretboard diagram
function diagram(v, opts={}){
  const w = opts.w || 92, strings=6, frets=5;
  const padL=19, padT=20, gx=(w-padL-10)/(strings-1), gy=opts.gy||16, h=padT+gy*frets+8;
  const fretted = v.frets.filter(f=>f>0);
  const maxF = fretted.length? Math.max(...fretted):0;
  const start = maxF<=5 ? 1 : Math.min(...fretted);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(v.frets.map(f=>f<0?"x":f).join(" "))}">`;
  // nut / position
  if(start===1) s += `<rect x="${padL}" y="${padT-3}" width="${gx*5}" height="3" fill="var(--ink)"/>`;
  else s += `<text x="${padL-3}" y="${padT+gy*0.68}" font-size="10" text-anchor="end" fill="var(--muted)" font-family="var(--font-mono)">${start}</text>`;
  for(let i=0;i<=frets;i++) s += `<line x1="${padL}" x2="${padL+gx*5}" y1="${padT+i*gy}" y2="${padT+i*gy}" stroke="var(--line)" stroke-width="1"/>`;
  for(let i=0;i<strings;i++) s += `<line x1="${padL+i*gx}" x2="${padL+i*gx}" y1="${padT}" y2="${padT+frets*gy}" stroke="var(--muted)" stroke-width="${1+ (5-i)*0.18}" opacity=".8"/>`;

    s += `<rect x="${padL+v.barre.from*gx-5}" y="${y-5.5}" width="${(v.barre.to-v.barre.from)*gx+10}" height="11" rx="5.5" fill="var(--ink)"/>`;
  }
  v.frets.forEach((f,i)=>{
    const x = padL+i*gx;
    if(f<0) s += `<text x="${x}" y="${padT-7}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--font-mono)">×</text>`;
    else if(f===0) s += `<circle cx="${x}" cy="${padT-10}" r="3.4" fill="none" stroke="${v.roots[i]?"var(--accent)":"var(--muted)"}" stroke-width="1.4"/>`;

      const y = padT+(f-start+0.5)*gy;
      const inBarre = v.barre && f===v.barre.fret && i>=v.barre.from && i<=v.barre.to;
      if(!inBarre || v.roots[i]) s += `<circle cx="${x}" cy="${y}" r="5.6" fill="${v.roots[i]?"var(--accent)":"var(--ink)"}"/>`;

    }
  });
  return s + `</svg>`;
}
const KIND_LABEL = {open:"Open position", barre:"Barre", compact:"Compact (4 strings)", moveable:"Moveable"};
function vLabel(v){
  const pos = v.kind==="open" ? "" : (" · fret "+v.posFret);
  return (KIND_LABEL[v.kind]||v.kind) + pos + " · root on " + ["6th","5th","4th","3rd","2nd","1st"][6-v.rootOn] + " string";
}

// ================= sound: plucked strings =================
let AC=null;
function ctx(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==="suspended") AC.resume(); return AC; }
function pluck(midi, when, gainV=0.32){
  const ac=ctx(), f=440*Math.pow(2,(midi-69)/12), sr=ac.sampleRate, dur=2.2;
  const N=Math.round(sr/f), buf=ac.createBuffer(1, Math.round(sr*dur), sr), d=buf.getChannelData(0);
  const ring=new Float32Array(N); for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
  let idx=0; for(let i=0;i<d.length;i++){ const nx=(idx+1)%N; const val=(ring[idx]+ring[nx])*0.4985; d[i]=ring[idx]; ring[idx]=val; idx=nx; }
  const src=ac.createBufferSource(); src.buffer=buf; const g=ac.createGain(); g.gain.value=gainV;
  src.connect(g).connect(ac.destination); src.start(when);
}
function strum(frets){
  try{ const ac=ctx(); let t=ac.currentTime+0.03; const T=[40,45,50,55,59,64];
    frets.forEach((f,i)=>{ if(f>=0){ pluck(T[i]+f, t); t+=0.035; } }); }catch(e){}
}

// ================= library =================
let libQuery="", libStatus="all";
const CONTENT = {both:"Chords + tabs", chords:"Chords", tabs:"Tabs", none:"Nothing yet"};
function contentOf(song){ const sh=getSheets(song).filter(x=>(x.text||"").trim()); const c=sh.some(x=>x.kind!=="tab"), t=sh.some(x=>x.kind==="tab"); return c&&t?"both":c?"chords":t?"tabs":"none"; }
function renderLibrary(v){
  const songs=[...S.songs.values()];

  const counts = {all:songs.length, both:0, chords:0, tabs:0, none:0}; songs.forEach(s=>counts[contentOf(s)]++);
  const list = songs.filter(s => (libStatus==="all"||contentOf(s)===libStatus) && (
      !q || (s.title+" "+(s.artist||"")).toLowerCase().includes(q) || chordsOfSong(s).join(" ").toLowerCase().includes(q)))
    .sort((a,b)=> (b.createdAt||b.updatedAt||"").localeCompare(a.createdAt||a.updatedAt||""));
  v.innerHTML = `
    <div class="libhead"><div><h1>Songs</h1><div class="muted">${songs.length} song${songs.length===1?"":"s"}</div></div>
      <div class="row">${fillQueue().length?`<a class="btn" href="#fill">Fill songs <span class="badge" style="margin-left:2px">${fillQueue().length}</span></a>`:""}<button class="btn primary" id="addSong">+ Add song</button></div></div>
    ${S.offline && !S.db ? `<div class="note" style="margin-bottom:14px">Your saved songs can't be reached in this view. Open the page from claude.ai while signed in to see and save songs.</div>`:""}
    ${S.offline && S.db ? `<div class="note" style="margin-bottom:14px">Can't reach your saved songs yet. They'll appear as soon as the connection is back.</div>`:""}
    <div class="filters">
      <input id="q" type="search" placeholder="Search title, artist or chord…" value="${esc(libQuery)}" aria-label="Search songs">
      <div class="seg" role="group" aria-label="Filter by what the song has">
        ${["all","both","chords","tabs","none"].map(k=>`<button data-st="${k}" aria-pressed="${libStatus===k}">${k==="all"?"All":CONTENT[k]} <span class="muted">${counts[k]}</span></button>`).join("")}
      </div>
    </div>
    ${list.length ? `<div class="grid">${list.map(cardHTML).join("")}</div>` :
      `<div class="note">${songs.length ? "No songs match this filter." : `No songs yet. Send me an Instagram link or a song name in the chat, save reels to your Instagram “Guitar” collection, or press <b>+ Add song</b>.`}</div>`}`;
  v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ libStatus=b.dataset.st; renderLibrary(v); });
  $("#q",v).addEventListener("input", e=>{ libQuery=e.target.value; const pos=e.target.selectionStart; renderLibrary(v); const i=$("#q",v); i.focus(); i.setSelectionRange(pos,pos); });
  v.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ location.hash="song-"+c.dataset.id; });
  $("#addSong",v).onclick=()=>openSongForm(null);
}
function cardHTML(s){
  const ch = chordsOfSong(s);
  const vids=(s.sources||[]).filter(x=>x.kind==="instagram"||x.kind==="youtube").length;
  const he = hasHeb(s.title);
  const ct = contentOf(s);
  return `<button class="card" data-id="${esc(s.id)}" data-content="${ct}">
    <div class="row" style="justify-content:space-between;width:100%"><span class="pill ${ct}">${CONTENT[ct]}</span>${s.capo?`<span class="muted mono" style="font-size:12px">capo ${esc(s.capo)}</span>`:""}</div>

function openSongForm(song){

  openDlg(song?"Edit song details":"Add song", `
    <form class="form" id="sf">

      <label>Key<input name="key" value="${esc(s.key||"")}" placeholder="e.g. G or Em"></label>
      <label>Capo<input name="capo" type="number" min="0" max="12" value="${esc(s.capo||0)}"></label>
      <label>Tempo (BPM)<input name="bpm" type="number" min="30" max="260" value="${esc(s.bpm||"")}"></label>
      <label>Time signature<select name="timeSig">${["4/4","3/4","6/8","2/4","12/8"].map(t=>`<option ${s.timeSig===t?"selected":""}>${t}</option>`).join("")}</select></label>

        <button class="btn primary" type="submit">${song?"Save":"Create song"}</button>
      </div>
    </form>`);
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const out = song ? Object.assign({}, song) : {id:uid(), sheets:[], sources:[], shots:[], notes:"", createdAt:new Date().toISOString()};
    for(const k of ["title","artist","key","strum","timeSig"]) out[k]=String(f.get(k)||"").trim();
    out.capo = +f.get("capo")||0; out.bpm = +f.get("bpm")||null;
    out.lang = hasHeb(out.title) ? "he" : "en";
    closeDlg(); await saveSong(out);
    if(!song) location.hash="song-"+out.id; else route();
  };
  if(song) $("#delSong").onclick = async () => {
    const b=$("#delSong"); if(b.dataset.c){ closeDlg(); await deleteSong(song.id); location.hash="library"; toast("Song deleted"); }
    else { b.dataset.c=1; b.textContent="Click again to delete"; b.style.color="#c0392b"; }
  };
}

function sheetTabsHTML(song, n, flats, heb){
  const sheets = getSheets(song);
  const ug = `https://www.ultimate-guitar.com/search.php?search_type=title&value=${encodeURIComponent(song.title+" "+(song.artist||""))}`;
  const t4u = `https://www.tab4u.com/resultsSimple?tab=songs&q=${encodeURIComponent(song.title)}`;
  const vs = videoVersions(song), selV = selVideo(song), owned = new Set(vs.map(x=>x.id));
  if(!sheets.length && !vs.length) return `<section class="panel" style="margin-bottom:16px"><h2>Chords &amp; tabs</h2>
    <p class="empty-sheet" style="margin-top:0">No versions yet. Open the song on a chords site, select the whole page (Ctrl+A), copy it, and press <b>Add version</b>. Site menus and comments are removed for you.</p>
    <div class="row"><a class="btn small" href="${ug}" target="_blank" rel="noopener">Find on Ultimate Guitar</a>${heb?`<a class="btn small" href="${t4u}" target="_blank" rel="noopener">Find on Tab4u</a>`:""}<button class="btn small primary" id="addSheet">+ Add version</button></div></section>`;
  // order: chords first, then tabs
  const texts = sheets.filter(x=>!owned.has(x.sourceId));
  const ordered = texts.filter(x=>x.kind!=="tab").concat(texts.filter(x=>x.kind==="tab"));
  // all video versions live in ONE tab; its dropdown picks the version
  const curV = selV || vs.find(x=>x.id===S.srcVer) || vs[0];
  const allIg = vs.every(x=>x.kind==="instagram");
  const vtabs = vs.length ? `<div class="st vtab" role="tab" aria-selected="${!!selV}"><button class="btn small ghost" style="padding:2px 4px;font-weight:600" data-srcver="${esc(curV.id)}"><span class="vlab">▶ ${allIg?"Instagram":"Videos"}<small>${vs.length} version${vs.length>1?"s":""}</small></span></button>
      <select data-versel aria-label="Choose the video version">${vs.map((x,i)=>`<option value="${esc(x.id)}" ${x===curV?"selected":""}>${i+1}. ${esc(verLabel(x,i))}${x.kind==="youtube"?" (YouTube)":""}${(x.shots||[]).length?` · ${x.shots.length} 📷`:""}</option>`).join("")}</select></div>` : "";
  const addBtns = `<button class="btn small add" id="addSheet2">+ Add version</button><button class="btn small add" id="addShotsVer" title="A version made only of screenshots, with no video">+ Screenshots</button>`;
  if(selV) return `<div class="sheettabs" role="tablist" aria-label="Versions">${vtabs}${ordered.map(sh=>`<button class="st" role="tab" data-sheet="${esc(sh.id)}" aria-selected="false">${sheetName(sheets, sh)}${sh.label?`<small dir="auto">${esc(sh.label)}</small>`:""}</button>`).join("")}${addBtns}</div>${videoPanelHTML(song, selV, n, flats)}`;
  if(!ordered.length) return `<div class="sheettabs" role="tablist" aria-label="Versions">${vtabs}${addBtns}</div>`;
  const cur = ordered.find(x=>x.id===S.sheetId) || ordered[0];
  const rtl = cur.kind!=="tab" && (song.lang==="he" || hasHeb(cur.text));
  const nn = n + ((+cur.capo||0) - (+song.capo||0));
  const info = [cur.source, cur.kind!=="tab" ? ("written for "+((+cur.capo||0)?("capo "+cur.capo):"no capo")) : "", cur.tuning&&!/^E\s*A\s*D\s*G\s*B\s*E$/i.test(cur.tuning)?("tuning "+cur.tuning):""].filter(Boolean).join(" · ");
  return `<div class="sheettabs" role="tablist" aria-label="Versions">
      ${vtabs}${ordered.map(sh=>`<button class="st" role="tab" data-sheet="${esc(sh.id)}" aria-selected="${sh===cur}">${sheetName(sheets, sh)}${sh.label?`<small dir="auto">${esc(sh.label)}</small>`:""}</button>`).join("")}
      ${addBtns}
    </div>
    <section class="panel sheetpanel" role="tabpanel">
      <div class="sheetbar"><span class="muted" style="font-size:12px">${esc(info)}${cur.url?` · <a href="${esc(cur.url)}" target="_blank" rel="noopener">original</a>`:""}</span>
        <span class="row" style="gap:6px"><a class="btn small" href="${ug}" target="_blank" rel="noopener">Find on UG</a>${heb?`<a class="btn small" href="${t4u}" target="_blank" rel="noopener">Find on Tab4u</a>`:""}<button class="btn small" id="editCurSheet" data-id="${esc(cur.id)}">Edit</button></span></div>
      ${(cur.text||"").trim()?fullSheetHTML(cur.text, rtl, nn, flats, cur.kind):""}
      ${(cur.shots&&(cur.shots.length||!(cur.text||"").trim()))?`<h3 class="vh">Screenshots ${uploadBtn("sheet:"+cur.id)}</h3>${shotsHTML(cur.shots,"sheet:"+cur.id)}${convertBtnHTML(cur.shots,"sheet:"+cur.id)}`:""}
    </section>`;
}
function videoPanelHTML(song, src, n, flats){
  const sheets = getSheets(song), mine = sheets.filter(x=>x.sourceId===src.id), key = "src:"+src.id;

  return `<section class="panel sheetpanel" role="tabpanel">
    <div class="sheetbar"><span class="muted" style="font-size:12px" dir="auto">${esc(info)}${shared?" · shared with another song":""} · <a href="${esc(src.url)}" target="_blank" rel="noopener">original</a></span>
      <span class="row" style="gap:6px"><button class="btn small" data-play="${esc(src.id)}">▶ Play</button><button class="btn small ghost" data-editsrc="${esc(src.id)}">Edit video</button></span></div>
    ${canHear(src)?`<div class="vswitch ${vview(src)==="shots"?"right":""}" role="radiogroup" aria-label="What to show for this version"><span class="knob"></span><button role="radio" aria-checked="${vview(src)==="audio"}" data-vview="audio">🎧 From the audio</button><button role="radio" aria-checked="${vview(src)==="shots"}" data-vview="shots">📷 From screenshots</button></div>`:""}
    ${vview(src)==="audio" ? heardPanelHTML(song, src, n, flats) : `
    <h3 class="vh">Screenshots ${uploadBtn(key)}</h3>

    ${convertBtnHTML(src.shots, key)}`}
  </section>`;
}
// ================= chords from the audio, read once in the background (extension 1.4.0) =================
const canHear = src => src && src.kind==="instagram" && !!igPath(src.url);
const vview = src => canHear(src) && S.vview!=="shots" ? "audio" : "shots";
const heardSheet = (song, srcId) => getSheets(song).find(x=>x.heard && x.sourceId===srcId);
// AN: background analysis state per version {state:"wait"|"play"|"load"|"read"|"done"|"err", pct, msg}
const AN = {by:{}, want:null, noExtT:null};
function anMsg(srcId){
  const a=AN.by[srcId]; if(!a) return "";
  return a.state==="wait" ? "Connecting to the extension…"
    : a.state==="play" ? "Press ▶ in the video once; the chords are read right after."
    : a.state==="load" ? "Loading the sound…"
    : a.state==="read" ? `Reading the chords… ${a.pct||0}%`

// segments -> draft text: one line per ~4 chords, each line starting with the time of its first chord

  };
  if(key.startsWith("src:")){
    const sid=key.slice(4);

    if(ch.trim()) put("chords", ch, {fromKey:key});
  }

}

const EASY = new Set(["C","D","E","G","A","Am","Em","Dm","E7","A7","D7","G7","C7","B7","Am7","Em7","Dm7","Cmaj7","Fmaj7","Amaj7","Dmaj7","Gmaj7","Asus2","Asus4","Dsus2","Dsus4","Esus4","Cadd9","E5","A5","D5","G/B","C/G","D/F#"]);
function capoHelpHTML(song){
  const base = chordsOfSong(song).map(c=>tChord(c, (+song.capo||0)+S.transpose, false)); // concert pitch
  if(!base.length) return "";
  const opts=[];
  for(let c=0;c<=7;c++){ const shapes=base.map(ch=>tChord(ch,-c,false)); const easy=shapes.filter(x=>EASY.has(x)).length; opts.push({c,shapes,easy}); }
  const capoNow = S.viewCapo===null ? (+song.capo||0) : S.viewCapo;
  const best = opts.filter(o=>o.easy===base.length || o.easy>=Math.ceil(base.length*0.75)).sort((a,b)=>b.easy-a.easy||a.c-b.c).slice(0,3);

  return `<div class="capohelp"><span class="muted" style="font-size:12px;align-self:center">Easy open shapes:</span>${best.map(o=>`<button class="btn small" data-capo="${o.c}" ${o.c===capoNow&&!S.transpose?'aria-pressed="true"':""}>Capo ${o.c||"none"} → <span class="mono">${esc(o.shapes.join(" "))}</span></button>`).join("")}</div>`;

const KINDS = {instagram:"Instagram", youtube:"YouTube", ug:"Ultimate Guitar", songsterr:"Songsterr", tab4u:"Tab4u", spotify:"Spotify", web:"Link"};
function srcKind(url){ const u=String(url||"").toLowerCase(); return u.includes("instagram.com")?"instagram":(u.includes("youtu")?"youtube":u.includes("ultimate-guitar")?"ug":u.includes("songsterr")?"songsterr":u.includes("tab4u")?"tab4u":u.includes("spotify.com")?"spotify":"web"); }
function markUrl(src, t){
  if(src.kind==="instagram"){
    // opens the reel at that second and pauses: needs the Songbook Chrome extension
    const m=/instagram\.com\/(?:[^\/?#]+\/)?(reels?|p|tv)\/([^\/?#]+)/i.exec(String(src.url||""));
    if(!m) return null;
    const kind = m[1].toLowerCase()==="reels" ? "reel" : m[1].toLowerCase();
    return "https://www.instagram.com/"+kind+"/"+m[2]+"/#t="+(+(+t).toFixed(2))+(S.songId?"&song="+encodeURIComponent(S.songId):"");
  }
  if(src.kind!=="youtube") return null;
  try{ const u=new URL(src.url); u.searchParams.set("t", Math.round(t)+"s"); return u.toString(); }catch(e){ return null; }
}
const MARK_KIND = {part:"Section", chords:"Chords on screen", tab:"Tab on screen", riff:"Riff / solo", tip:"Tip"};
function srcHTML(src){

    ${(src.kind==="instagram"&&igPath(src.url))||(src.kind==="youtube"&&ytId(src.url))?`<div style="margin:4px 0"><button class="btn small" data-play="${esc(src.id)}">▶ Play here</button></div>`:""}
    ${src.by||src.note?`<div class="muted" style="font-size:13px" dir="auto">${src.by?esc(src.by)+(src.note?" · ":""):""}${esc(src.note||"")}</div>`:""}
    ${marks.length?`<div class="marks">${marks.map(m=>{ const u=markUrl(src,m.t); const inner=`<b>${fmtT(m.t)}</b>${esc(m.label||MARK_KIND[m.kind]||"")}`; return u?`<a class="mark ${m.kind==="tab"?"tab":""}" href="${esc(u)}" data-seek="${+m.t}" data-src="${esc(src.id)}" target="_blank" rel="noopener" title="Jump to ${fmtT(m.t)}">${inner}</a>`:`<span class="mark ${m.kind==="tab"?"tab":""}" title="${esc(MARK_KIND[m.kind]||"")}">${inner}</span>`; }).join("")}</div>`:""}

// ---- versions: a "holder" owns screenshots. key = "src:<sourceId>" (video version) | "sheet:<sheetId>" (text version) | "song" (legacy, not yet migrated)
function codeOf(src){
  if(src.kind==="instagram"){ const p=igPath(src.url); return p?"ig:"+p.code:null; }
  if(src.kind==="youtube"){ const i=ytId(src.url); return i?"yt:"+i:null; }
  return null;
}
function videoVersions(song){ return (song.sources||[]).filter(x=>codeOf(x)); }
function verLabel(src, i){ const p=src.kind==="instagram"?igPath(src.url):null; return src.by || (p?p.code:"") || src.title || ("Video "+(i+1)); }
function selVideo(song){
  const vs=videoVersions(song); if(!vs.length) return null;
  if(S.sheetId && getSheets(song).some(x=>x.id===S.sheetId)) return null;
  return vs.find(x=>x.id===S.srcVer) || vs[0];
}
// the same video in other songs is ONE shared version: its screenshots are mirrored there
function linkedSrcs(song, src){
  const out=[{song, h:src}], c=codeOf(src); if(!c) return out;
  for(const s of S.songs.values()){ if(s.id===song.id) continue; for(const x of (s.sources||[])) if(codeOf(x)===c) out.push({song:s, h:x}); }
  return out;
}
function holderOf(song, key){
  if(key.startsWith("src:")) return (song.sources||[]).find(x=>x.id===key.slice(4));
  if(key.startsWith("sheet:")) return getSheets(song).find(x=>x.id===key.slice(6));
  return song;
}
function holdersFor(song, key){ const h=holderOf(song,key); if(!h) return []; return key.startsWith("src:") ? linkedSrcs(song,h) : [{song, h}]; }
async function addShotsTo(song, key, entries){
  for(const {song:s, h} of holdersFor(song,key)){
    h.shots=h.shots||[]; let ch=false;
    for(const e of entries){ if(h.shots.some(a=>a.assetId===e.assetId)) continue; h.shots.push(Object.assign({}, e)); ch=true; }
    if(ch) await saveSong(s);
  }
}
const addShotTo = (song, key, entry) => addShotsTo(song, key, [entry]);

// ---- one-time move of song-level screenshots to their versions (preview + confirm)
function planMigration(){
  const plan=[];
  for(const song of S.songs.values()){
    const shots=song.shots||[]; if(!shots.length) continue;
    const toSrc=new Map(), rest=[];
    for(const sh of shots){
      const src = sh.srcCode && (song.sources||[]).find(x=>codeOf(x)==="ig:"+sh.srcCode);
      if(src){ if(!toSrc.has(src.id)) toSrc.set(src.id,[]); toSrc.get(src.id).push(sh); } else rest.push(sh);
    }
    plan.push({song, toSrc, rest});
  }
  return plan;
}
function openMigrateDialog(){
  const plan=planMigration();
  if(!plan.length){ openDlg("Move screenshots to versions", `<p>Nothing to move: no song has screenshots outside a version.</p>`); return; }
  let nV=0, nT=0;
  const rows=plan.map(p=>{
    const lines=[];
    for(const [sid,list] of p.toSrc){ const vs=videoVersions(p.song), src=vs.find(x=>x.id===sid); nV+=list.length; lines.push(`${list.length} → video “${esc(verLabel(src, vs.indexOf(src)))}”${linkedSrcs(p.song,src).length>1?" (shared with another song)":""}`); }
    if(p.rest.length){ nT+=p.rest.length; lines.push(`${p.rest.length} → new text version “Screenshots”`); }
    return `<tr><td dir="auto"><b>${esc(p.song.title)}</b></td><td>${lines.join("<br>")}</td></tr>`;
  }).join("");
  openDlg("Move screenshots to versions", `
    <p class="help">${nV} screenshot${nV===1?"":"s"} go to the video version they were taken from, ${nT} with no matching video go to a new “Screenshots” version. Nothing is deleted. <b>Press Export data first</b> if you haven't today.</p>
    <div style="max-height:50vh;overflow:auto"><table style="width:100%;font-size:14px"><tbody>${rows}</tbody></table></div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" id="migGo">Move ${nV+nT} screenshots</button></div>`);
  $("#migGo").onclick=async()=>{
    $("#migGo").disabled=true; $("#migGo").textContent="Moving…";
    try{
      for(const p of plan){
        const song=p.song;
        for(const [sid,list] of p.toSrc) await addShotsTo(song, "src:"+sid, list.map(({srcCode,...e})=>e));
        if(p.rest.length){
          migrate(song);
          let sh=song.sheets.find(x=>x.label==="Screenshots" && !(x.text||"").trim());
          if(!sh){ sh={id:uid(), kind:"tab", label:"Screenshots", text:"", capo:+song.capo||0, shots:[]}; song.sheets=song.sheets.concat([sh]); }
          sh.shots=sh.shots||[];
          for(const e of p.rest.map(({srcCode,...r})=>r)) if(!sh.shots.some(a=>a.assetId===e.assetId)) sh.shots.push(e);
        }
        song.shots=[]; await saveSong(song);
      }
      closeDlg(); toast("Moved "+(nV+nT)+" screenshots"); route();
    }catch(err){ toast("Migration stopped: "+(err.message||err)); }
  };
}
document.getElementById("migrateBtn").onclick=e=>{ e.preventDefault(); openMigrateDialog(); };

// ================= Import marks (JSON from the video pass) =================
// {"format":"songbook-import-v1","reels":[{"code":"DAbc12","marks":[{"t":12,"kind":"part","label":"Verse"}],"identify":{"title":"","artist":"","note":""}}]}
// marks go to every video version with that reel code (never deleting, skipping t±1s + same kind); "identify" fills the guess of a pending reel, which you still approve in To approve.
function normCode(c){ c=String(c||"").trim(); const p=igPath(c); if(p) return ["ig:"+p.code]; const y=/^https?:/.test(c)?ytId(c):null; if(y) return ["yt:"+y]; if(/^(ig|yt):/.test(c)) return [c]; return c?["ig:"+c,"yt:"+c]:[]; }
function planImport(data){
  const errs=[], items=[];
  if(!data || data.format!=="songbook-import-v1" || !Array.isArray(data.reels)) return {errs:["This file isn't a Songbook import (format songbook-import-v1 expected)."], items};
  for(const r of data.reels){
    const codes=normCode(r.code||r.url); if(!codes.length){ errs.push("A reel without a code was skipped."); continue; }
    const marks=(Array.isArray(r.marks)?r.marks:[]).map(m=>({t:Math.round((+m.t)*10)/10, kind:MARK_KIND[m.kind]?m.kind:"part", label:String(m.label||"").slice(0,80)})).filter(m=>isFinite(m.t)&&m.t>=0);
    const targets=[];
    for(const s of S.songs.values()) for(const x of (s.sources||[])) if(codes.includes(codeOf(x))) targets.push({song:s, src:x,
      add:marks.filter(m=>!(x.marks||[]).some(o=>o.kind===m.kind && Math.abs(o.t-m.t)<=1)).filter((m,i,a)=>a.findIndex(z=>z.kind===m.kind&&Math.abs(z.t-m.t)<=1)===i)});
    const pend=S.pending.find(p=>p.type==="identify" && p.sourceUrl && codes.includes(codeOf({kind:srcKind(p.sourceUrl), url:p.sourceUrl})));
    const idf=r.identify && (r.identify.title||r.identify.artist||r.identify.note) ? {title:String(r.identify.title||"").slice(0,120), artist:String(r.identify.artist||"").slice(0,120), note:String(r.identify.note||"").slice(0,400)} : null;
    if(!targets.length && !(pend&&idf)){ errs.push("Reel "+(r.code||r.url)+": not found in any song"+(idf?" or pending item":"")+"."); continue; }
    items.push({code:String(r.code||r.url), targets, pend:(pend&&idf)?pend:null, idf, nMarks:marks.length, marks});
  }
  return {errs, items};
}
function openImportDialog(){
  openDlg("Import marks", `<p class="help">Choose the JSON file from the video pass (or paste it). You'll see exactly what will be added before anything is written. Nothing is ever deleted.</p>
    <input type="file" id="impFile" accept=".json,application/json"><textarea id="impTxt" rows="4" style="width:100%;margin-top:8px" placeholder="…or paste the JSON here"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn small" id="impPrev">Preview</button></div><div id="impOut"></div>`);
  $("#impFile").onchange=async e=>{ const f=e.target.files[0]; if(f){ $("#impTxt").value=await f.text(); $("#impPrev").click(); } };
  $("#impPrev").onclick=()=>{
    let data; try{ data=JSON.parse($("#impTxt").value); }catch(err){ $("#impOut").innerHTML=`<p style="color:#c0392b">Not valid JSON: ${esc(err.message)}</p>`; return; }
    const plan=planImport(data); let nAdd=0, nProp=0;
    const rows=plan.items.map(it=>{
      const parts=it.targets.map(t=>{ nAdd+=t.add.length; return `<div dir="auto"><b>${esc(t.song.title)}</b> · reel ${esc(it.code)}: ${t.add.length?t.add.map(m=>`${fmtT(m.t)} ${esc(m.label||MARK_KIND[m.kind])}`).join(", "):"<span class='muted'>nothing new</span>"}${it.nMarks-t.add.length>0&&t.add.length<it.nMarks?` <span class="muted">(${it.nMarks-t.add.length} already there)</span>`:""}</div>`; });
      if(it.pend){ nProp++; parts.push(`<div dir="auto">Pending reel ${esc(it.code)}: suggest <b>${esc(it.idf.title)}</b> — ${esc(it.idf.artist)}${it.idf.note?` <span class="muted">(${esc(it.idf.note)})</span>`:""}</div>`); }
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line,#ddd)">${parts.join("")}</div>`;
    }).join("");
    $("#impOut").innerHTML=`${plan.errs.length?`<div class="note" style="margin:10px 0">${plan.errs.map(esc).join("<br>")}</div>`:""}
      <div style="max-height:40vh;overflow:auto;margin-top:10px">${rows||"<p class='muted'>Nothing to import.</p>"}</div>
      ${nAdd||nProp?`<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" id="impGo">Add ${nAdd} mark${nAdd===1?"":"s"}${nProp?` and ${nProp} suggestion${nProp===1?"":"s"}`:""}</button></div>`:""}`;
    const go=$("#impGo"); if(go) go.onclick=async()=>{
      go.disabled=true; go.textContent="Writing…";
      try{
        for(const it of plan.items){
          for(const t of it.targets){ if(!t.add.length) continue; t.src.marks=(t.src.marks||[]).concat(t.add); await saveSong(t.song); }
          if(it.pend && S.db){ const {id, ...rest}=it.pend; const up=Object.assign({}, rest, {guessTitle:it.idf.title||rest.guessTitle||"", guessArtist:it.idf.artist||rest.guessArtist||"", message:it.idf.note||rest.message||"", sourceMarks:(rest.sourceMarks||[]).concat(it.marks.filter(m=>!(rest.sourceMarks||[]).some(o=>o.kind===m.kind&&Math.abs(o.t-m.t)<=1)))}); Object.assign(it.pend, up); await S.db.doc("pending/"+id).set(JSON.parse(JSON.stringify(up))); }
        }
        closeDlg(); toast("Imported: "+nAdd+" marks, "+nProp+" suggestions"); route();
      }catch(err){ toast("Import stopped: "+(err.message||err)); }
    };
  };
}

function serializeSheet(song){
  return (song.sections||[]).map(s => (s.name?`[${s.name}]\n`:"") + (s.lines||[]).join("\n")).join("\n\n");
}
function parseSheet(text){
  const secs=[]; let cur=null;
  for(const raw of text.replace(/\r/g,"").split("\n")){
    const line = raw.replace(/\s+$/,"");
    const m=/^\s*\[(.+)\]\s*$/.exec(line);
    if(m){ cur={name:m[1].trim(), lines:[]}; secs.push(cur); continue; }
    if(!line.trim()) continue;
    if(!cur){ cur={name:"", lines:[]}; secs.push(cur); }
    cur.lines.push(line);
  }
  return secs;
}

const _vgCache = new Map();
function voicingsOf(sym){ let a=_vgCache.get(sym); if(!a){ a=generateVoicings(sym); _vgCache.set(sym,a); } return a; }
function curSong(){ return location.hash.startsWith("#song-") ? S.songs.get(S.songId) : null; }
function pickedVoicing(sym, song){
  const all=voicingsOf(sym); song = song===undefined ? curSong() : song;
  const fr = song && song.voicings && song.voicings[sym];
  if(fr){ const v=all.find(x=>x.frets.join(",")===fr); if(v) return v; }
  return all[0]||null;
}
async function setSongVoicing(song, sym, fr){
  song.voicings = Object.assign({}, song.voicings||{});
  if(fr) song.voicings[sym]=fr; else delete song.voicings[sym];
  await saveSong(song);
}
function voicingGridHTML(sym, filter){

    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div><b>${esc(sym)}</b> <span class="muted">${p?esc(p.q.name)+(p.bassName?" over "+esc(p.bassName):""):""} · notes ${esc(tones.join(" – "))}${p&&p.bassName?" + "+esc(p.bassName)+" in the bass":""}</span></div>

    </div>
    ${song?`<p class="muted" style="margin:0 0 10px">${mine?`This song uses your chosen shape (✓). <button class="btn small ghost" data-vuse="">↺ Back to most common</button>`:`Press “Use in this song” under a shape to see it whenever you hover ${esc(sym)} in “${esc(song.title)}”.`}</p>`:""}
    ${list.length?`<div class="vgrid">${list.map((v,i)=>{ const fr=v.frets.join(","), isMine=song&&(mine?mine===fr:(i===0&&filter==="all")); return `<div class="vwrap"><button class="vcard ${i===0&&filter==="all"&&!mine?"first":""} ${mine===fr?"mine":""}" data-fr="${fr}" title="${esc(vLabel(v))}">${diagram(v)}<span class="frets">${v.frets.map(f=>f<0?"x":f).join(" ")}</span><span class="lbl">${mine===fr?"<b>✓ In this song</b> · ":i===0&&filter==="all"?"<b>Most common</b> · ":""}${esc(vLabel(v))}</span></button>${song&&!isMine?`<button class="btn small ghost vuse" data-vuse="${fr}">Use in this song</button>`:""}</div>`; }).join("")}</div>`:`<p class="muted">No playable shapes found for this chord name.</p>`}`;
}
function wireVoicings(root, sym, rerender){
  root.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{ S.vfilter=b.dataset.vf; rerender(); });
  root.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>strum(b.dataset.fr.split(",").map(Number)));
  root.querySelectorAll("[data-vuse]").forEach(b=>b.onclick=async()=>{
    const song=curSong(); if(!song) return;
    const fr=b.dataset.vuse;
    try{ await setSongVoicing(song, sym, fr||null); toast(fr?"Shape saved for “"+song.title+"”":"Back to the most common shape"); }
    catch(e){ toast("Couldn't save the shape"); }
    rerender(); route();
  });
}
function openVoicings(sym){
